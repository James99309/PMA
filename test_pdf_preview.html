<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF预览测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>PDF预览功能测试</h2>
        
        <div class="row">
            <div class="col-md-6">
                <h4>测试按钮</h4>
                <button class="btn btn-primary" onclick="testPDFPreview()">
                    <i class="fas fa-file-pdf me-2"></i>测试PDF预览
                </button>
                
                <div class="mt-3">
                    <h5>测试URL</h5>
                    <input type="text" id="testPdfUrl" class="form-control" 
                           placeholder="输入PDF文件URL进行测试"
                           value="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf">
                </div>
            </div>
            
            <div class="col-md-6">
                <h4>控制台日志</h4>
                <div id="consoleLog" class="border p-3" style="height: 300px; overflow-y: auto; background: #f8f9fa; font-family: monospace; font-size: 12px;">
                    <!-- 日志会显示在这里 -->
                </div>
            </div>
        </div>
    </div>

    <!-- PDF预览对话框 -->
    <div class="modal fade" id="testPdfModal" tabindex="-1" aria-labelledby="testPdfModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="testPdfModalLabel">PDF预览测试</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="image-loading text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">加载中...</span>
                        </div>
                        <div class="mt-2">正在加载PDF预览...</div>
                    </div>
                    
                    <img class="preview-image" style="display: none; max-width: 100%; height: auto;">
                    
                    <div class="image-error text-center" style="display: none;">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <div>预览加载失败</div>
                        <button class="btn btn-primary mt-2 retry-load-btn">重试</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 重写console.log以显示在页面上
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function logToPage(message, type = 'log') {
            const logEl = document.getElementById('consoleLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black';
            logEl.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logToPage(args.join(' '), 'log');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logToPage(args.join(' '), 'warn');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logToPage(args.join(' '), 'error');
        };
        
        function testPDFPreview() {
            const pdfUrl = document.getElementById('testPdfUrl').value;
            if (!pdfUrl) {
                alert('请输入PDF文件URL');
                return;
            }
            
            console.log('开始测试PDF预览，URL:', pdfUrl);
            
            // 显示模态框
            const modal = new bootstrap.Modal(document.getElementById('testPdfModal'));
            modal.show();
            
            // 调用PDF预览函数
            loadPreviewPDF(document.getElementById('testPdfModal'), pdfUrl, 'test.pdf');
        }
        
        // 从ui_helpers.html复制的函数（简化版）
        function loadPreviewPDF(dialog, pdfPath, filename) {
            const previewImage = dialog.querySelector('.preview-image');
            const loadingEl = dialog.querySelector('.image-loading');
            const errorEl = dialog.querySelector('.image-error');
            const retryBtn = dialog.querySelector('.retry-load-btn');
            
            console.log('开始加载PDF预览:', pdfPath);
            
            // 显示加载状态
            loadingEl.style.display = 'flex';
            errorEl.style.display = 'none';
            previewImage.style.display = 'none';
            
            // 创建PDF预览容器
            let pdfContainer = dialog.querySelector('.pdf-preview-container');
            if (!pdfContainer) {
                pdfContainer = document.createElement('div');
                pdfContainer.className = 'pdf-preview-container';
                pdfContainer.style.cssText = `
                    width: 100%;
                    height: 500px;
                    display: none;
                    border: 1px solid #ddd;
                    border-radius: 4px;
                    overflow: auto;
                    position: relative;
                    background: #f8f9fa;
                `;
                
                // 插入到预览图片后面
                previewImage.parentNode.insertBefore(pdfContainer, previewImage.nextSibling);
            }
            
            // 清空容器
            pdfContainer.innerHTML = '';
            
            // 优先使用iframe方式
            console.log('尝试PDF预览，URL:', pdfPath);
            
            // 方案1：尝试使用iframe嵌入PDF
            const iframe = document.createElement('iframe');
            iframe.src = pdfPath;
            iframe.style.cssText = `
                width: 100%;
                height: 500px;
                border: none;
                border-radius: 4px;
            `;
            
            iframe.onload = () => {
                console.log('✅ 通过iframe成功加载PDF');
                loadingEl.style.display = 'none';
                pdfContainer.style.display = 'block';
            };
            
            iframe.onerror = () => {
                console.warn('❌ iframe方式失败，尝试PDF.js方式');
                tryPDFJS();
            };
            
            // 设置超时检查
            let timeoutId = setTimeout(() => {
                if (loadingEl.style.display !== 'none') {
                    console.warn('⏱️ iframe加载超时，尝试PDF.js方式');
                    tryPDFJS();
                }
            }, 3000);
            
            iframe.addEventListener('load', () => {
                clearTimeout(timeoutId);
            });
            
            pdfContainer.appendChild(iframe);
            
            function tryPDFJS() {
                console.log('尝试使用PDF.js渲染');
                pdfContainer.innerHTML = '';
                
                if (!window.pdfjsLib) {
                    console.log('加载PDF.js库...');
                    const script = document.createElement('script');
                    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                    script.onload = () => {
                        console.log('✅ PDF.js加载成功');
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                        renderPDFPreview();
                    };
                    script.onerror = () => {
                        console.error('❌ PDF.js加载失败');
                        showPDFError('PDF预览库加载失败，但您仍可下载文件');
                    };
                    document.head.appendChild(script);
                } else {
                    renderPDFPreview();
                }
            }
            
            function renderPDFPreview() {
                console.log('开始使用PDF.js渲染:', pdfPath);
                
                const loadingTask = window.pdfjsLib.getDocument(pdfPath);
                
                loadingTask.promise.then(pdf => {
                    console.log('✅ PDF.js加载成功，页数:', pdf.numPages);
                    return pdf.getPage(1);
                }).then(page => {
                    console.log('✅ 获取PDF第一页成功');
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.style.cssText = `
                        max-width: 100%;
                        height: auto;
                        border-radius: 4px;
                        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                    `;
                    
                    const viewport = page.getViewport({ scale: 1.5 });
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    
                    return page.render(renderContext).promise.then(() => {
                        console.log('✅ PDF页面渲染完成');
                        pdfContainer.appendChild(canvas);
                        
                        const infoDiv = document.createElement('div');
                        infoDiv.innerHTML = `
                            <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 3px; font-size: 12px;">
                                PDF - 第1页/共${pdf.numPages}页
                            </div>
                        `;
                        pdfContainer.appendChild(infoDiv);
                        
                        loadingEl.style.display = 'none';
                        pdfContainer.style.display = 'block';
                    });
                }).catch(error => {
                    console.error('❌ PDF加载或渲染失败:', error);
                    showPDFError('PDF文件无法预览，请下载查看');
                });
            }
            
            function showPDFError(message) {
                pdfContainer.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6c757d;">
                        <i class="fas fa-file-pdf" style="font-size: 3rem; margin-bottom: 1rem; color: #dc3545;"></i>
                        <div style="margin-bottom: 1rem;">${message}</div>
                        <div style="font-size: 0.9rem;">
                            <a href="${pdfPath}" target="_blank" class="btn btn-primary btn-sm">
                                <i class="fas fa-external-link-alt me-1"></i>在新窗口打开
                            </a>
                        </div>
                    </div>
                `;
                loadingEl.style.display = 'none';
                pdfContainer.style.display = 'block';
            }
        }
        
        console.log('PDF预览测试页面已加载');
    </script>
</body>
</html>
