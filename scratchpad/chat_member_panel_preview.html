<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天成员面板预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { DEFAULT: '#6366f1', dark: '#4f46e5' },
                    }
                }
            }
        }
    </script>
    <style>
        .chat-panel-scroll::-webkit-scrollbar { width: 4px; }
        .chat-panel-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-panel-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-8">

<div x-data="{
    // 模拟数据
    activeConv: {
        id: 1,
        type: 'private',
        name: '管理员',
        avatar: '管',
        memberCount: 2,
        participants: [
            { user_id: 1, role: 'owner', user_name: '我自己', department: '技术部' },
            { user_id: 2, role: 'member', user_name: '管理员', department: '管理层' },
        ]
    },
    showMemberPanel: false,
    addMemberQuery: '',
    addMemberResults: [],
    searchTimer: null,

    // 模拟用户列表
    allUsers: [
        { id: 3, name: '张三', avatar: '张', dept: '销售部' },
        { id: 4, name: '李四', avatar: '李', dept: '技术部' },
        { id: 5, name: '王五', avatar: '王', dept: '市场部' },
        { id: 6, name: '赵六', avatar: '赵', dept: '财务部' },
        { id: 7, name: '陈七', avatar: '陈', dept: '海外事业部' },
    ],

    toggleMemberPanel() {
        this.showMemberPanel = !this.showMemberPanel;
        this.addMemberQuery = '';
        this.addMemberResults = [];
    },

    searchAddMember() {
        const q = this.addMemberQuery.trim().toLowerCase();
        if (!q) { this.addMemberResults = []; return; }
        const existingIds = new Set(this.activeConv.participants.map(p => p.user_id));
        this.addMemberResults = this.allUsers.filter(u =>
            !existingIds.has(u.id) && (u.name.includes(q) || u.dept.includes(q))
        );
    },

    addMember(user) {
        this.activeConv.participants.push({
            user_id: user.id,
            role: 'member',
            user_name: user.name,
            department: user.dept
        });
        this.activeConv.memberCount = this.activeConv.participants.length;
        // 私聊自动升级为群聊
        if (this.activeConv.type === 'private') {
            this.activeConv.type = 'group';
            // 生成群聊名称
            this.activeConv.name = this.activeConv.participants
                .map(p => p.user_name).join('、');
        }
        this.addMemberQuery = '';
        this.addMemberResults = [];
    },

    // 模拟对话列表数据
    conversations: [
        { id: 1, type: 'private', name: '管理员', avatar: '管', lastMsg: '在吗', time: '刚刚', unread: 0 },
        { id: 2, type: 'ai', name: 'AI 助手', avatar: '', lastMsg: '@AI 在吗?', time: '17分钟前', unread: 0 },
    ],

    messages: [
        { id: 1, content: '在吗', is_mine: false, sender_name: '管理员', created_at: '12:12' },
    ],
}" class="w-[800px] h-[600px] bg-white rounded-2xl shadow-2xl border border-slate-200 flex overflow-hidden relative">

    <!-- ====== 左栏：对话列表 ====== -->
    <div class="w-[260px] border-r border-slate-200 flex flex-col bg-slate-50/50 flex-shrink-0">
        <div class="h-14 px-4 flex items-center justify-between border-b border-slate-200 flex-shrink-0">
            <h3 class="text-sm font-semibold text-slate-900">消息</h3>
            <button class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:text-primary hover:bg-primary/10 transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-xl">edit_square</span>
            </button>
        </div>
        <div class="px-3 py-2 flex-shrink-0">
            <div class="relative">
                <span class="material-symbols-outlined text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 text-lg">search</span>
                <input type="text" placeholder="搜索对话..." class="w-full h-9 pl-9 pr-3 text-sm bg-white border border-slate-200 rounded-lg placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-primary/50">
            </div>
        </div>
        <div class="flex-1 overflow-y-auto chat-panel-scroll">
            <template x-for="conv in conversations" :key="conv.id">
                <button class="w-full px-3 py-3 flex items-start gap-3 hover:bg-white transition-colors cursor-pointer text-left"
                        :class="{ 'bg-white shadow-sm': conv.id === activeConv.id }">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-medium flex-shrink-0"
                         :class="conv.type === 'ai' ? 'bg-gradient-to-br from-violet-500 to-purple-600 text-white'
                                : conv.type === 'group' ? 'bg-gradient-to-br from-blue-500 to-cyan-500 text-white'
                                : 'bg-slate-200 text-slate-600'">
                        <span x-show="conv.type === 'ai'" class="material-symbols-outlined text-lg">auto_awesome</span>
                        <span x-show="conv.type === 'group'" class="material-symbols-outlined text-lg">group</span>
                        <span x-show="conv.type === 'private'" x-text="conv.avatar"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <span class="text-sm font-medium text-slate-900 truncate" x-text="conv.name"></span>
                            <span class="text-[11px] text-slate-400 flex-shrink-0 ml-2" x-text="conv.time"></span>
                        </div>
                        <p class="text-xs text-slate-500 truncate mt-0.5" x-text="conv.lastMsg"></p>
                    </div>
                </button>
            </template>
        </div>
    </div>

    <!-- ====== 右栏：聊天区域 ====== -->
    <div class="flex-1 flex flex-col min-w-0">

        <!-- 右栏头部 -->
        <div class="h-14 px-4 flex items-center justify-between border-b border-slate-200 flex-shrink-0">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-slate-900" x-text="activeConv.name"></span>
                <span x-show="activeConv.type === 'group'"
                      class="text-xs text-slate-400"
                      x-text="activeConv.memberCount + '人'"></span>
            </div>
            <div class="flex items-center gap-1">
                <!-- 成员管理按钮：非 AI 对话都显示 -->
                <button x-show="activeConv.type !== 'ai'"
                        @click="toggleMemberPanel()"
                        class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors cursor-pointer"
                        :class="showMemberPanel
                            ? 'text-primary bg-primary/10'
                            : 'text-slate-400 hover:text-slate-600 hover:bg-slate-100'"
                        :title="activeConv.type === 'group' ? '群成员' : '添加成员'">
                    <span class="material-symbols-outlined text-lg"
                          x-text="activeConv.type === 'group' ? 'people' : 'person_add'"></span>
                </button>
                <button class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
        </div>

        <!-- 消息区域 + 成员面板 容器 -->
        <div class="flex-1 flex min-h-0">

            <!-- 消息区域 -->
            <div class="flex-1 flex flex-col min-w-0">
                <!-- 消息列表 -->
                <div class="flex-1 overflow-y-auto p-4 space-y-4 chat-panel-scroll">
                    <template x-for="msg in messages" :key="msg.id">
                        <div :class="msg.is_mine ? 'flex justify-end' : 'flex justify-start'">
                            <div class="max-w-[75%]">
                                <div x-show="!msg.is_mine && msg.sender_name" class="flex items-center gap-1.5 mb-1">
                                    <span class="text-xs font-medium text-slate-500" x-text="msg.sender_name"></span>
                                </div>
                                <div class="px-3 py-2 rounded-2xl text-sm leading-relaxed"
                                     :class="msg.is_mine
                                        ? 'bg-primary text-white rounded-br-md'
                                        : 'bg-slate-100 text-slate-900 rounded-bl-md'">
                                    <span x-text="msg.content"></span>
                                </div>
                                <div class="mt-1 text-[10px] text-slate-400"
                                     :class="msg.is_mine ? 'text-right' : 'text-left'"
                                     x-text="msg.created_at"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 输入框 -->
                <div class="px-4 py-3 border-t border-slate-200 flex-shrink-0">
                    <div class="flex items-end gap-2">
                        <div class="flex-1 relative">
                            <textarea rows="1" placeholder="输入消息... (Enter 发送)"
                                      class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl resize-none focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary max-h-32"></textarea>
                        </div>
                        <button class="w-9 h-9 flex items-center justify-center rounded-xl bg-primary text-white hover:bg-primary-dark transition-colors cursor-pointer flex-shrink-0">
                            <span class="material-symbols-outlined text-lg">send</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ====== 成员面板（右侧抽屉） ====== -->
            <div x-show="showMemberPanel"
                 x-transition:enter="transition ease-out duration-200"
                 x-transition:enter-start="opacity-0 translate-x-4"
                 x-transition:enter-end="opacity-100 translate-x-0"
                 x-transition:leave="transition ease-in duration-150"
                 x-transition:leave-start="opacity-100 translate-x-0"
                 x-transition:leave-end="opacity-0 translate-x-4"
                 class="w-[220px] border-l border-slate-200 flex flex-col bg-slate-50/30 flex-shrink-0">

                <!-- 面板头部 -->
                <div class="px-3 py-3 border-b border-slate-200 flex items-center justify-between flex-shrink-0">
                    <span class="text-xs font-semibold text-slate-700">成员 <span class="text-slate-400 font-normal" x-text="'(' + activeConv.participants.length + ')'"></span></span>
                    <button @click="showMemberPanel = false"
                            class="w-6 h-6 flex items-center justify-center rounded text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined text-base">close</span>
                    </button>
                </div>

                <!-- 添加成员区域 -->
                <div class="px-3 py-2 border-b border-slate-100 flex-shrink-0">
                    <div class="relative">
                        <span class="material-symbols-outlined text-slate-400 absolute left-2 top-1/2 -translate-y-1/2 text-base">person_add</span>
                        <input type="text"
                               x-model="addMemberQuery"
                               @input="searchAddMember()"
                               placeholder="搜索添加成员..."
                               class="w-full h-8 pl-8 pr-2 text-xs bg-white border border-slate-200 rounded-lg placeholder:text-slate-400 focus:outline-none focus:ring-1 focus:ring-primary/50 focus:border-primary transition-colors">

                        <!-- 搜索结果下拉 -->
                        <div x-show="addMemberResults.length > 0"
                             class="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden z-20">
                            <div class="py-1 max-h-36 overflow-y-auto chat-panel-scroll">
                                <template x-for="user in addMemberResults" :key="user.id">
                                    <button @click="addMember(user)"
                                            class="w-full px-2.5 py-2 flex items-center gap-2 text-left hover:bg-slate-50 transition-colors cursor-pointer">
                                        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium bg-slate-200 text-slate-600"
                                             x-text="user.avatar"></div>
                                        <div class="min-w-0">
                                            <div class="text-xs text-slate-900 truncate" x-text="user.name"></div>
                                            <div class="text-[10px] text-slate-400 truncate" x-text="user.dept"></div>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- 无结果提示 -->
                        <div x-show="addMemberQuery.trim() && addMemberResults.length === 0"
                             class="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-20">
                            <div class="px-3 py-3 text-center text-[11px] text-slate-400">
                                未找到匹配的用户
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 成员列表 -->
                <div class="flex-1 overflow-y-auto chat-panel-scroll">
                    <template x-for="member in activeConv.participants" :key="member.user_id">
                        <div class="px-3 py-2 flex items-center gap-2.5 hover:bg-white/60 transition-colors">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-medium bg-slate-200 text-slate-600 flex-shrink-0"
                                 x-text="member.user_name ? member.user_name[0] : '?'"></div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-medium text-slate-900 truncate" x-text="member.user_name"></span>
                                    <span x-show="member.role === 'owner'"
                                          class="text-[9px] bg-amber-100 text-amber-700 px-1 py-0.5 rounded font-medium flex-shrink-0">群主</span>
                                </div>
                                <div class="text-[10px] text-slate-400 truncate" x-text="member.department"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 说明 -->
<div class="fixed top-4 left-4 bg-white rounded-lg shadow-lg p-4 max-w-xs border border-slate-200">
    <h3 class="text-sm font-bold text-slate-900 mb-2">预览说明</h3>
    <ul class="text-xs text-slate-600 space-y-1.5">
        <li>1. 点击右上角 <span class="inline-flex items-center"><span class="material-symbols-outlined text-sm align-middle">person_add</span></span> 按钮打开成员面板</li>
        <li>2. 在搜索框输入 "张"、"李"、"技术" 等搜索用户</li>
        <li>3. 点击搜索结果添加成员</li>
        <li>4. 添加后私聊会自动升级为群聊（头部名称和成员数变化）</li>
    </ul>
</div>

</body>
</html>
