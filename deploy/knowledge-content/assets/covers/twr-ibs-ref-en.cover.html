<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:576px;background:#1c1b17;color:#f3efe6;
     font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;opacity:.16;
  background-image:linear-gradient(#3b3831 1px,transparent 1px),linear-gradient(90deg,#3b3831 1px,transparent 1px);
  background-size:48px 48px}
.bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:#9c2b1f}
.wrap{position:relative;padding:66px 72px 0 84px;height:100%;display:flex;flex-direction:column}
.brand{font-size:15px;letter-spacing:.42em;color:#e0cfc6;font-weight:600}
.kicker{margin-top:10px;font-size:12px;letter-spacing:.26em;color:#918a7c;text-transform:uppercase}
h1{margin-top:44px;font-family:Georgia,"Times New Roman",serif;font-size:54px;line-height:1.16;font-weight:600;letter-spacing:-.5px}
h1 em{font-style:normal;color:#c9846f}
.sub{margin-top:22px;font-size:19px;color:#b6ae9f;line-height:1.5;max-width:660px}
.rule{margin-top:30px;width:150px;height:2px;background:#9c2b1f}
.foot{margin-top:auto;margin-bottom:52px;display:flex;align-items:center;gap:18px}
.tag{border:1px solid #3b3831;border-radius:3px;padding:7px 14px;font-size:13px;letter-spacing:.1em;color:#918a7c}
.tag.draft{border-color:#9c2b1f;color:#e09c8b}
</style></head><body>
<div class="grid"></div><div class="bar"></div>
<div class="wrap">
  <div class="brand">EVERTAC</div>
  <div class="kicker">Technical Design Reference</div>
  <h1>Two-Way Radio<br><em>In-Building Systems</em></h1>
  <div class="sub">Architecture &middot; Distributed antenna system &middot; Performance testing &amp; acceptance</div>
  <div class="rule"></div>
  <div class="foot">
    <span class="tag draft">16 chapters &middot; Appendices A&ndash;N</span>
    <span class="tag">Methodology ref. DG/TJ 08&mdash;2406&mdash;2022</span>
    <span class="tag draft">Pending technical review</span>
  </div>
</div></body></html>
