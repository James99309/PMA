# Render部署配置文件
services:
  # Web服务配置
  - type: web
    name: pma-app
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && chmod +x render_start.sh
    startCommand: ./render_start.sh
    healthCheckPath: /auth/login
    envVars:
      - key: DATABASE_URL
        value: postgresql://pma_db_sp8d_user:LXNGJmR6bFrNecoaWbdbdzPpltIAd40w@dpg-d0b1gl1r0fns73d1jc1g-a.singapore-postgres.render.com/pma_db_sp8d
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: pma-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SSL_MODE
        value: require
      - key: RENDER
        value: true
      - key: PGSSLMODE
        value: require
      - key: PYTHON_VERSION
        value: 3.11.0
      # Supabase 存储配置 - PMA项目
      - key: SUPABASE_URL
        value: https://iqcyimnjtnmomvfuwjzw.supabase.co
      - key: SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxY3lpbW5qdG5tb212ZnV3anp3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1NDc1Mjg5NiwiZXhwIjoyMDcwMzI4ODk2fQ.ivIwtz0Icp0eBibB4RAVh9iAULTHhCkKfPF9QOFnvfY
      # 多存储桶配置
      - key: SUPABASE_BUCKET_INVOICE
        value: invoice-images
      - key: SUPABASE_BUCKET_PRODUCT
        value: product-images
      - key: SUPABASE_BUCKET_RD_PRODUCT
        value: rd-product-images
      - key: SUPABASE_BUCKET
        value: invoice-images
      - key: FORCE_CLOUD_UPLOAD
        value: true
    autoDeploy: true
    
  # 定时任务配置 - 每天执行数据同步
  - type: cron
    name: pma-daily-sync
    env: python
    schedule: "0 2 * * *"  # 每天凌晨2点执行
    buildCommand: pip install -r requirements.txt
    startCommand: python db_migration/migrate_data_to_render.py
    envVars:
      - key: DATABASE_URL
        value: postgresql://pma_db_sp8d_user:LXNGJmR6bFrNecoaWbdbdzPpltIAd40w@dpg-d0b1gl1r0fns73d1jc1g-a.singapore-postgres.render.com/pma_db_sp8d
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: pma-db
          property: connectionString
      - key: RENDER
        value: true
      - key: PGSSLMODE
        value: require

# 数据库配置
databases:
  - name: pma-db
    databaseName: pma_db_sp8d
    region: singapore
    plan: starter