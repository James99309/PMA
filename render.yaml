# Render部署配置文件
services:
  # Web服务配置
  - type: web
    name: pma-app
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && chmod +x render_start.sh
    startCommand: ./render_start.sh
    healthCheckPath: /auth/login
    envVars:
      # DATABASE_URL 应在Render控制台环境变量中设置
      # 指向: postgresql://postgres.pqzviljbpfoqvyfulakl:***@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      # SQLALCHEMY_DATABASE_URI 将使用与 DATABASE_URL 相同的值
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SSL_MODE
        value: require
      - key: RENDER
        value: true
      - key: PGSSLMODE
        value: require
      - key: PYTHON_VERSION
        value: 3.11.0
      # Supabase 存储配置 - PMA项目
      - key: SUPABASE_URL
        value: https://iqcyimnjtnmomvfuwjzw.supabase.co
      - key: SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxY3lpbW5qdG5tb212ZnV3anp3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1NDc1Mjg5NiwiZXhwIjoyMDcwMzI4ODk2fQ.ivIwtz0Icp0eBibB4RAVh9iAULTHhCkKfPF9QOFnvfY
      # 多存储桶配置
      - key: SUPABASE_BUCKET_INVOICE
        value: invoice-images
      - key: SUPABASE_BUCKET_PRODUCT
        value: product-images
      - key: SUPABASE_BUCKET_RD_PRODUCT
        value: rd-product-images
      - key: SUPABASE_BUCKET
        value: invoice-images
      - key: FORCE_CLOUD_UPLOAD
        value: true
    autoDeploy: true
    
  # 定时任务配置 - 每天执行数据同步
  - type: cron
    name: pma-daily-sync
    env: python
    schedule: "0 2 * * *"  # 每天凌晨2点执行
    buildCommand: pip install -r requirements.txt
    startCommand: python db_migration/migrate_data_to_render.py
    envVars:
      # DATABASE_URL 应在Render控制台环境变量中设置
      # 指向: postgresql://postgres.pqzviljbpfoqvyfulakl:***@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres
      # SQLALCHEMY_DATABASE_URI 将使用与 DATABASE_URL 相同的值
      - key: RENDER
        value: true
      - key: PGSSLMODE
        value: require

# 数据库配置 - 使用外部Supabase数据库
# 不再使用Render内置数据库服务
# DATABASE_URL 需要在Render控制台环境变量中手动设置