<script>
    // 密码显示/隐藏切换
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    });

    // 表单验证
    (function() {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation');

        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');
            }, false);
        });
    })();

    // 语言切换功能
    document.addEventListener('DOMContentLoaded', function() {
        // 每次页面加载时刷新语言状态
        updateLanguageDisplay();
        
        // 监听页面可见性变化，当用户从系统内返回登录页面时刷新语言状态
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                updateLanguageDisplay();
            }
        });
        
        // 监听存储变化，当其他页面更改语言时同步
        window.addEventListener('storage', function(e) {
            if (e.key === 'language_changed') {
                updateLanguageDisplay();
            }
        });
    });

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 响应式管理器 - 必须在其他JS之前加载 -->
    <script src="/static/js/responsive-manager.js"></script>
    <script>
        // 用户下拉菜单交互
        document.addEventListener('DOMContentLoaded', function() {
            const userDropdown = document.getElementById('userDropdown');
            const userDropdownMenu = document.getElementById('userDropdownMenu');

            if(userDropdown && userDropdownMenu) {
                userDropdown.addEventListener('click', function(e) {
                    e.stopPropagation();
                    userDropdownMenu.classList.toggle('show');
                });

                // 点击其他区域关闭下拉菜单
                document.addEventListener('click', function() {
                    userDropdownMenu.classList.remove('show');
                });

                // 防止点击菜单内部时关闭菜单
                userDropdownMenu.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
            
            // 处理多级下拉菜单
            const dropdownItems = document.querySelectorAll('.dropdown-item.dropdown-toggle');
            dropdownItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // 找到下一级菜单
                    const submenu = this.nextElementSibling;
                    if (submenu && submenu.classList.contains('dropdown-menu')) {
                        submenu.classList.toggle('show');
                    }
                });
            });
            
            // 点击其他区域关闭所有子菜单
            document.addEventListener('click', function() {
                const submenus = document.querySelectorAll('.dropdown-submenu.show');
                submenus.forEach(menu => menu.classList.remove('show'));
            });

            // 设置AJAX请求的CSRF令牌
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

            // 为所有AJAX请求添加CSRF令牌
            $(document).ajaxSend(function(e, xhr, options) {
                xhr.setRequestHeader("X-CSRFToken", csrfToken);
            });

            // 为fetch请求准备CSRF头
            window.fetchWithCsrf = function(url, options = {}) {
                options.headers = options.headers || {};
                options.headers['X-CSRFToken'] = csrfToken;
                return fetch(url, options);
            };
            
            // 语言切换功能
            initLanguageSwitcher();
            
            // 移动端菜单自动收缩功能
            initMobileMenuCollapse();
            
            // 初始化语言显示状态
            updateLanguageDisplay();
        });

        // 表头下拉筛选交互脚本
        function toggleAll(allCheckbox, field) {
            const options = document.querySelectorAll(`#${field}_options input[type="checkbox"]`);
            options.forEach(cb => cb.checked = allCheckbox.checked);
        }

        function filterOptions(input) {
            const value = input.value.toLowerCase();
            const container = input.closest('.dropdown-menu').querySelector('.filter-options');
            const items = container.querySelectorAll('.form-check');
            items.forEach(item => {
                const label = item.querySelector('label');
                const text = label.textContent.toLowerCase();
                item.style.display = text.includes(value) ? '' : 'none';
            });
        }
        
        // 🌍 更新语言显示状态的通用函数
        function updateLanguageDisplay() {
            // 添加缓存破坏参数确保每次都获取最新状态
            fetch('/language/current?' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const currentLang = data.language;
                    
                    // 更新桌面端语言切换器显示
                    const mainCurrentLanguage = document.getElementById('mainCurrentLanguage');
                    if (mainCurrentLanguage) {
                        if (currentLang === 'en') {
                            mainCurrentLanguage.textContent = 'English';
                        } else {
                            mainCurrentLanguage.textContent = '简体中文';
                        }
                    }
                    
                    // 更新移动端语言切换器显示（如果存在）
                    const mobileCurrentLanguageTop = document.getElementById('mobileCurrentLanguageTop');
                    if (mobileCurrentLanguageTop) {
                        if (currentLang === 'en') {
                            mobileCurrentLanguageTop.textContent = 'English';
                        } else {
                            mobileCurrentLanguageTop.textContent = '简体中文';
                        }
                    }
                    
                    // 更新登录页面的语言显示（如果存在）
                    const currentLangText = document.getElementById('currentLanguageText');
                    if (currentLangText) {
                        if (currentLang === 'en') {
                            currentLangText.textContent = 'English';
                        } else {
                            currentLangText.textContent = '简体中文';
                        }
                    }
                    
                    // 更新桌面端选中状态图标
                    document.querySelectorAll('.main-language-option i').forEach(icon => {
                        icon.style.visibility = 'hidden';
                    });
                    const mainCheckIcon = document.getElementById(`main-check-${currentLang}`);
                    if (mainCheckIcon) {
                        mainCheckIcon.style.visibility = 'visible';
                    }
                    
                    // 更新移动端侧边栏语言选中状态图标
                    document.querySelectorAll('.mobile-sidebar-language-option i').forEach(icon => {
                        icon.style.visibility = 'hidden';
                    });
                    const mobileSidebarCheckIcon = document.getElementById(`mobile-sidebar-check-${currentLang}`);
                    if (mobileSidebarCheckIcon) {
                        mobileSidebarCheckIcon.style.visibility = 'visible';
                    }
                    
                    // 更新登录页面的选中状态图标（如果存在）
                    document.querySelectorAll('.language-option i').forEach(icon => {
                        icon.style.visibility = 'hidden';
                    });
                    const checkIcon = document.getElementById(`check-${currentLang}`);
                    if (checkIcon) {
                        checkIcon.style.visibility = 'visible';
                    }
                })
                .catch(error => console.error('获取当前语言失败:', error));
        }
        
        // 语言切换功能初始化
        function initLanguageSwitcher() {
            // 初始化语言显示状态
            updateLanguageDisplay();
            
            // 绑定桌面端语言切换事件
            document.querySelectorAll('.main-language-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    const selectedLang = this.getAttribute('data-lang');

            // 绑定移动端侧边栏语言切换事件  
            document.querySelectorAll('.mobile-sidebar-language-option').forEach(option => {

                    e.preventDefault();

                    switchLanguage(selectedLang);
                });

            // 绑定用户菜单语言切换事件（如果存在）
            document.querySelectorAll('.language-option').forEach(option => {
                option.addEventListener('click', function(e) {
                    e.preventDefault();
                    const selectedLang = this.getAttribute('data-lang');
                    switchLanguage(selectedLang);
                });
            });
        }
        
        // 移动端菜单自动收缩功能
        function initMobileMenuCollapse() {
            // 获取所有移动端的details元素（下拉菜单）
            const mobileMenus = document.querySelectorAll('.d-lg-none details');
            
            mobileMenus.forEach(menu => {
                menu.addEventListener('toggle', function() {
                    if (this.open) {
                        // 如果当前菜单被打开，关闭其他所有菜单
                        mobileMenus.forEach(otherMenu => {
                            if (otherMenu !== this && otherMenu.open) {
                                otherMenu.open = false;
                            }
                        });
                    }
                });
            });
            
            // 点击菜单项后自动关闭移动端菜单
            const mobileNavLinks = document.querySelectorAll('.d-lg-none .nav-link:not(summary)');
            const navbarToggler = document.querySelector('.navbar-toggler');
            const mainNavbar = document.getElementById('mainNavbar');
            
            mobileNavLinks.forEach(link => {
                // 排除有下拉菜单的链接
                if (!link.closest('details') || link.tagName.toLowerCase() !== 'summary') {
                    link.addEventListener('click', function(e) {
                        // 如果是普通链接（不是JavaScript链接），关闭移动端菜单
                        if (this.href && !this.href.includes('javascript:') && !this.href.includes('#')) {
                            setTimeout(() => {
                                if (mainNavbar && mainNavbar.classList.contains('show')) {
                                    // 触发collapse关闭
                                    const bsCollapse = bootstrap.Collapse.getInstance(mainNavbar);
                                    if (bsCollapse) {
                                        bsCollapse.hide();
                                    } else {
                                        mainNavbar.classList.remove('show');
                                    }
                                }
                            }, 100);
                        }
                    });
                }
            });
        }
        
        // 统一的语言切换函数
        function switchLanguage(selectedLang) {
            // 获取CSRF令牌
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') ||
                              document.querySelector('input[name="csrf_token"]')?.value;
            
            if (!csrfToken) {
                console.error('未找到CSRF令牌');
                alert('语言切换失败：安全令牌未找到');
                return;
            }
            
            // 发送语言切换请求
            fetch('/language/switch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ language: selectedLang })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 通知其他页面语言已变更
                    if (typeof(Storage) !== "undefined") {
                        localStorage.setItem('language_changed', Date.now());
                    }
                    // 刷新页面以应用新语言
                    window.location.reload();
                } else {
                    alert(data.message || '语言切换失败');
                }
            })
            .catch(error => {
                console.error('语言切换失败:', error);
                alert('语言切换失败，请稍后重试');
            });
        }
    </script>
    
    <!-- 导航栏毛玻璃滚动效果 -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const navbar = document.querySelector('.navbar-glass-morphism');
        if (!navbar) return;
        
        let lastScrollTop = 0;
        const scrollThreshold = 50;
        
        function updateNavbarOnScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            // 添加滚动类来增强毛玻璃效果
            if (scrollTop > scrollThreshold) {
                navbar.classList.add('navbar-scrolled');
            } else {
                navbar.classList.remove('navbar-scrolled');
            }
            
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }
        
        // 使用 requestAnimationFrame 优化性能
        let ticking = false;
        function requestTick() {
            if (!ticking) {
                requestAnimationFrame(updateNavbarOnScroll);
                ticking = true;
                setTimeout(() => { ticking = false; }, 10);
            }
        }
        
        // 监听滚动事件
        window.addEventListener('scroll', requestTick, { passive: true });
        
        // 初始检查
        updateNavbarOnScroll();
    });
    </script>
