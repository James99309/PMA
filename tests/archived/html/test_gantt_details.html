<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甘特图详情面板测试</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 甘特图样式 -->
    <link rel="stylesheet" href="app/static/css/gantt-chart.css">
    <style>
        body { padding: 20px; }
        .test-info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .test-actions {
            margin-bottom: 20px;
        }
        .test-actions button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>甘特图详情面板显示测试</h1>
    
    <div class="test-info">
        <h5>测试说明：</h5>
        <ol>
            <li>点击"模拟点击阶段"按钮，测试详情面板是否正常显示</li>
            <li>检查控制台是否还有"详情面板元素不存在"的错误</li>
            <li>测试关闭按钮是否正常工作</li>
        </ol>
    </div>

    <div class="test-actions">
        <button class="btn btn-primary" onclick="testShowDetails()">模拟点击阶段</button>
        <button class="btn btn-secondary" onclick="testHideDetails()">隐藏详情面板</button>
        <button class="btn btn-info" onclick="testCreateSubStage()">模拟创建子阶段</button>
    </div>

    <!-- 甘特图组件 -->
    <div class="gantt-chart-wrapper" style="height: 500px;">
        <div class="gantt-container" id="testGanttChart">
            <!-- 主要甘特图区域 -->
            <div class="gantt-main-area">
                <!-- 左侧任务树 -->
                <div class="task-tree">
                    <div class="tree-header">
                        <i class="fas fa-tasks me-2"></i>
                        阶段管理
                    </div>
                    <div class="tree-content">
                        <div class="task-list" id="taskList">
                            <div class="task-item main-stage" data-task-id="research" data-stage="research">
                                <div class="expand-icon"></div>
                                <div class="task-name">调研阶段</div>
                            </div>
                            <div class="task-item main-stage" data-task-id="planning" data-stage="planning">
                                <div class="expand-icon"></div>
                                <div class="task-name">立项阶段</div>
                            </div>
                            <div class="task-item main-stage" data-task-id="development" data-stage="development">
                                <div class="expand-icon"></div>
                                <div class="task-name">研发阶段</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧甘特图 -->
                <div class="gantt-chart">
                    <div class="gantt-header">
                        <div class="gantt-nav">
                            <button type="button" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            <span class="gantt-month">2024年1月</span>
                            <button type="button" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                        <div class="gantt-days">
                            <div class="gantt-day">1</div>
                            <div class="gantt-day">2</div>
                            <div class="gantt-day">3</div>
                            <!-- 更多日期... -->
                        </div>
                    </div>
                    
                    <div class="gantt-content">
                        <div class="gantt-bars">
                            <!-- 甘特条将由JavaScript生成 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部详情面板 -->
            <div class="gantt-details" id="ganttDetails" style="display: none;">
                <div class="details-header">
                    <div class="details-title" id="detailsTitle">阶段详情</div>
                    <div class="details-actions">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="closeDetails">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>
                <div class="details-content" id="detailsContent">
                    <!-- 详情内容将由JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 控制台日志区域 -->
    <div class="mt-4">
        <h5>控制台日志：</h5>
        <div id="logArea" style="background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; min-height: 100px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <!-- 甘特图JavaScript -->
    <script src="app/static/js/gantt-chart.js"></script>
    <script>
        // 重定向console.log到页面显示
        const originalLog = console.log;
        const originalWarn = console.warn;
        const logArea = document.getElementById('logArea');
        
        function addToLog(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.innerHTML = `<span style="color: ${type === 'warn' ? '#dc3545' : '#333'};">[${timestamp}] ${message}</span>`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToLog(args.join(' '), 'log');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToLog('WARNING: ' + args.join(' '), 'warn');
        };

        // 创建测试用的甘特图实例
        const testGantt = new GanttChart({
            containerId: 'testGanttChart',
            objectType: 'rd_product',
            objectId: 123,
            currentStage: 'planning',
            stageConfig: {
                mainStages: [
                    { key: 'research', name: '调研阶段', order: 0 },
                    { key: 'planning', name: '立项阶段', order: 1 },
                    { key: 'development', name: '研发阶段', order: 2 }
                ]
            },
            stageHistory: [],
            canEdit: true,
            csrfToken: 'test-token'
        });

        // 测试函数
        function testShowDetails() {
            console.log('=== 测试显示详情面板 ===');
            testGantt.showTaskDetails('planning');
        }

        function testHideDetails() {
            console.log('=== 测试隐藏详情面板 ===');
            testGantt.hideDetails();
        }

        function testCreateSubStage() {
            console.log('=== 测试创建子阶段面板 ===');
            testGantt.showCreateSubStagePanel('planning');
        }

        // 页面加载完成提示
        document.addEventListener('DOMContentLoaded', function() {
            console.log('测试页面加载完成，甘特图组件已初始化');
        });
    </script>
</body>
</html>
