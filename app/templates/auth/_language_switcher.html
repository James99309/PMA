{# 登录页面专用语言切换器 HTML #}
<div class="relative" id="languageSwitcherContainer">
    <button type="button" id="languageDropdownBtn"
            class="flex items-center space-x-1 text-sm text-slate-500 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
        </svg>
        <span id="currentLanguageText">{{ _('简体中文') }}</span>
        <svg class="w-3 h-3 transition-transform" id="languageDropdownArrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>
    <div id="languageDropdownMenu"
         class="hidden absolute right-0 top-full mt-1 min-w-[140px] bg-white border border-slate-200 rounded-lg shadow-lg z-50">
        <a href="#" class="flex items-center px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 rounded-t-lg language-option" data-lang="zh">
            <svg class="w-4 h-4 mr-2 text-green-500" id="check-zh" style="visibility: hidden;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>简体中文</span>
        </a>
        <a href="#" class="flex items-center px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 rounded-b-lg language-option" data-lang="en">
            <svg class="w-4 h-4 mr-2 text-green-500" id="check-en" style="visibility: hidden;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>English</span>
        </a>
    </div>
</div>
