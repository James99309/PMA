{# 规格编辑相关模态框组件 #}

{# 规格MN更新预览确认模态框 #}
{% macro tw_spec_preview_modal() %}
<div id="specMnPreviewModal" class="fixed inset-0 z-50 hidden" aria-modal="true">
    <div class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/75 transition-opacity" onclick="closeSpecMnPreviewModal()"></div>
    <div class="fixed inset-0 flex items-center justify-center p-4">
        <div class="bg-slate-100 dark:bg-slate-800 rounded-xl shadow-xl w-full max-w-sm transform transition-all overflow-hidden">
            <div class="p-5 text-left">
                <h3 class="flex items-center text-lg font-semibold text-slate-900 dark:text-slate-100 mb-3">
                    <span class="material-symbols-outlined text-amber-500 text-xl mr-2">info</span>
                    {{ _('编码更新预览') }}
                </h3>

                <!-- 产品编码 -->
                <div class="p-3 rounded-lg bg-white dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 mb-3">
                    <div class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">{{ _('产品编码') }}</div>
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex-1">
                            <span class="text-xs text-slate-400">{{ _('更新前') }}</span>
                            <div id="previewProductMnBefore" class="font-mono text-sm text-slate-700 dark:text-slate-300">-</div>
                        </div>
                        <span class="material-symbols-outlined text-slate-300 text-base">arrow_forward</span>
                        <div class="flex-1">
                            <span class="text-xs text-slate-400">{{ _('更新后') }}</span>
                            <div id="previewProductMnAfter" class="font-mono text-sm text-slate-700 dark:text-slate-300">-</div>
                        </div>
                        <div id="previewProductMnResult">
                            <span class="material-symbols-outlined text-slate-400 text-xl" title="{{ _('不更新') }}">block</span>
                        </div>
                    </div>
                </div>

                <p class="text-xs text-slate-500 dark:text-slate-400">
                    {{ _('产品描述将根据规格重新生成。') }}
                </p>
            </div>

            <!-- 按钮区域 -->
            <div class="px-5 py-4 flex flex-row-reverse gap-3 border-t border-slate-200 dark:border-slate-700 rounded-b-xl">
                <button type="button" onclick="confirmSpecMnPreview()" class="inline-flex justify-center items-center h-10 px-4 rounded-lg text-sm font-semibold text-white shadow-sm bg-primary hover:bg-primary-hover transition-colors">
                    {{ _('确定') }}
                </button>
                <button type="button" onclick="closeSpecMnPreviewModal()" class="inline-flex justify-center items-center h-10 px-4 rounded-lg border border-slate-300 dark:border-slate-600 text-sm font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                    {{ _('取消') }}
                </button>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
