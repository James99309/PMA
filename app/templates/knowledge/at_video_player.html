<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include 'components/_js_i18n.html' %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ course.title }} · {{ _('视频课程') }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/at-theme.css') }}">
<link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  html, body { height:100%; margin:0; }
  .vp-wrap { display:flex; flex-direction:column; height:100vh; background:var(--bg-page); }
  /* 顶栏 */
  .vp-bar { flex-shrink:0; display:flex; align-items:center; gap:14px;
            padding:10px 18px; background:var(--bg-elev); border-bottom:1px solid var(--line); }
  .vp-back { display:inline-flex; align-items:center; gap:6px; text-decoration:none;
             color:var(--ink-2); font-size:13px; padding:6px 12px; border-radius:8px;
             border:1px solid var(--line); background:var(--bg-page); white-space:nowrap; }
  .vp-back:hover { background:var(--bg-hover); color:var(--ink); }
  .vp-back .material-symbols-outlined { font-size:18px; }
  .vp-title { display:flex; flex-direction:column; min-width:0; flex:1; }
  .vp-title .t { font-family:var(--font-serif); font-size:15px; font-weight:600; color:var(--ink);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vp-title .s { font-size:11.5px; color:var(--accent); font-weight:500; }
  /* 主体:左视频 右章节 */
  .vp-body { flex:1; min-height:0; display:flex; }
  .vp-stage { flex:1; min-width:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .vp-video { width:100%; height:100%; max-height:100%; background:#000; outline:0; }
  .vp-aside { width:288px; flex-shrink:0; background:var(--bg-elev); border-left:1px solid var(--line);
              display:flex; flex-direction:column; }
  .vp-aside-hd { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  .vp-aside-hd .lbl { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
  .vp-aside-hd .cnt { font-size:13px; color:var(--ink-2); margin-top:3px; }
  .vp-chapters { flex:1; overflow-y:auto; padding:6px; }
  .vp-chap { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
             padding:9px 11px; border:0; background:transparent; border-radius:9px; cursor:pointer;
             color:var(--ink-2); font-size:13px; line-height:1.4; }
  .vp-chap:hover { background:var(--bg-hover); }
  .vp-chap.is-on { background:var(--accent-soft, rgba(0,166,196,.1)); color:var(--ink); }
  .vp-chap .no { flex-shrink:0; width:22px; height:22px; border-radius:6px; font-size:11.5px; font-weight:600;
                 display:flex; align-items:center; justify-content:center; background:var(--bg-page); color:var(--ink-3); }
  .vp-chap.is-on .no { background:var(--accent); color:#fff; }
  .vp-chap .tx { min-width:0; }
  .vp-chap .tm { font-size:11px; color:var(--ink-3); margin-top:2px; }
  .vp-empty { padding:40px 16px; text-align:center; color:var(--ink-3); font-size:12.5px; }
  /* 底部续播提示条 */
  .vp-resume { position:absolute; left:16px; bottom:70px; z-index:5; display:none; align-items:center; gap:10px;
               padding:9px 14px; border-radius:10px; background:rgba(8,22,28,.86); color:#eaf6f8; font-size:13px; }
  .vp-resume button { border:0; border-radius:7px; padding:5px 11px; font-size:12.5px; cursor:pointer;
                      background:var(--accent); color:#fff; }
  .vp-resume .x { background:transparent; color:#9fc; padding:5px 6px; }
  @media (max-width:820px){ .vp-aside{ display:none; } }
</style>
</head>
<body class="at-page">
<div class="vp-wrap">
  <div class="vp-bar">
    <a class="vp-back" href="{{ url_for('knowledge_wiki.at_wiki_page') }}#courses">
      <span class="material-symbols-outlined">arrow_back</span>{{ _('返回') }}</a>
    <div class="vp-title">
      <div class="t">{{ course.title }}</div>
      {% if course.subtitle %}<div class="s">{{ course.subtitle }}</div>{% endif %}
    </div>
  </div>
  <div class="vp-body">
    <div class="vp-stage" style="position:relative;">
      <video id="vpVideo" class="vp-video" controls preload="metadata" playsinline
             src="{{ url_for('knowledge_wiki.course_video', course_key=course.key) }}"></video>
      <div class="vp-resume" id="vpResume">
        <span id="vpResumeTxt"></span>
        <button onclick="vpDoResume()">{{ _('继续观看') }}</button>
        <button class="x" onclick="document.getElementById('vpResume').style.display='none'">✕</button>
      </div>
    </div>
    <aside class="vp-aside">
      <div class="vp-aside-hd">
        <div class="lbl">{{ _('章节') }}</div>
        <div class="cnt" id="vpChapCnt"></div>
      </div>
      <div class="vp-chapters" id="vpChapters"></div>
    </aside>
  </div>
</div>

<script>
  var COURSE = {{ course|tojson }};
  var VIDEO = document.getElementById('vpVideo');
  var CH = COURSE.chapters || [];

  function fmt(s){ s=Math.max(0,Math.floor(s||0)); var m=Math.floor(s/60), x=s%60; return m+':'+(x<10?'0':'')+x; }

  // ── 渲染章节 ──
  (function renderChapters(){
    var box = document.getElementById('vpChapters');
    document.getElementById('vpChapCnt').textContent = CH.length ? (CH.length + ' {{ _("节") }}') : '';
    if(!CH.length){ box.innerHTML = '<div class="vp-empty">{{ _("本视频暂无章节") }}</div>'; return; }
    box.innerHTML = CH.map(function(c,i){
      var title = c.title || ('{{ _("第") }}' + (c.page||i+1) + '{{ _("页") }}');
      return '<button class="vp-chap" data-i="'+i+'" data-start="'+(c.start||0)+'" onclick="vpSeek('+(c.start||0)+')">'
           + '<span class="no">'+(c.page||i+1)+'</span>'
           + '<span class="tx">'+title.replace(/</g,'&lt;')+'<div class="tm">'+fmt(c.start||0)+'</div></span></button>';
    }).join('');
  })();

  function vpSeek(t){ VIDEO.currentTime = t; VIDEO.play().catch(function(){}); }

  // ── 当前章节高亮(跟随播放进度)──
  function hlChapter(){
    if(!CH.length) return;
    var t = VIDEO.currentTime, idx = 0;
    for(var i=0;i<CH.length;i++){ if((CH[i].start||0) <= t+0.3) idx=i; else break; }
    document.querySelectorAll('.vp-chap').forEach(function(el){
      el.classList.toggle('is-on', +el.dataset.i===idx);
    });
  }

  // ── 续播 + 看完记录(step 4 接后端;此处先本地存,后端就绪自动切)──
  var PKEY = 'vp.pos.' + COURSE.key;
  var lastReport = 0;
  VIDEO.addEventListener('loadedmetadata', function(){
    var saved = 0; try{ saved = parseFloat(localStorage.getItem(PKEY)||'0'); }catch(e){}
    if(saved > 5 && saved < VIDEO.duration - 10){
      document.getElementById('vpResumeTxt').textContent = '{{ _("上次看到") }} ' + fmt(saved);
      document.getElementById('vpResume').style.display = 'flex';
      window._vpResumeTo = saved;
    }
  });
  function vpDoResume(){ if(window._vpResumeTo) VIDEO.currentTime = window._vpResumeTo;
    document.getElementById('vpResume').style.display='none'; VIDEO.play().catch(function(){}); }

  VIDEO.addEventListener('timeupdate', function(){
    hlChapter();
    var now = Date.now();
    if(now - lastReport > 15000){   // 每 15 秒记一次
      lastReport = now;
      try{ localStorage.setItem(PKEY, String(VIDEO.currentTime)); }catch(e){}
      vpReportProgress(VIDEO.currentTime, VIDEO.duration);   // step 4: 上报后端
    }
  });
  VIDEO.addEventListener('ended', function(){
    try{ localStorage.removeItem(PKEY); }catch(e){}
    vpReportProgress(VIDEO.duration, VIDEO.duration);
  });

  // step 4 会实现真正的后端上报;先留空实现,前端逻辑已就位
  function vpReportProgress(cur, dur){ /* TODO step 4: POST 进度 */ }
</script>
</body>
</html>
