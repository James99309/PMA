{# 基础参数子页签内容 - 用于薪资配置Tab #}
<div class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="param in baseParams" :key="param.id || param.param_code">
            <div class="border border-slate-200 dark:border-slate-700 rounded-lg p-4">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-slate-700 dark:text-slate-300" x-text="param.param_name"></label>
                    <span class="text-xs text-slate-400" x-text="param.param_unit"></span>
                </div>
                <input type="number" x-model.number="param.param_value" step="0.01"
                       @input="markParamChanged(param)"
                       :disabled="!isEditing"
                       class="w-full px-3 py-2 text-sm border border-slate-200 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 disabled:opacity-60 disabled:bg-slate-100 dark:disabled:bg-slate-800">
                <p class="mt-2 text-xs text-slate-500" x-text="param.description"></p>
            </div>
        </template>
    </div>
    <template x-if="baseParams.length === 0">
        <div class="text-center py-12 text-slate-400">
            {{ _('暂无基础参数配置，请点击"初始化默认数据"按钮') }}
        </div>
    </template>
</div>
