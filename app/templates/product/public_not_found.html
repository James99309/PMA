<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品未找到</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .error-card {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 40px 30px;
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 10px;
        }
        .error-message {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .error-code {
            display: inline-block;
            background: #f8d7da;
            color: #721c24;
            padding: 4px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="error-title">产品未找到</h1>
        <p class="error-message">
            抱歉，未找到编码为 <span class="error-code">{{ product_mn }}</span> 的产品。
        </p>
        <p class="error-message" style="font-size: 0.85rem;">
            该产品可能已被删除或编码有误。
        </p>
    </div>
</body>
</html>
