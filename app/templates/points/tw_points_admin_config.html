{% from 'components/tw_layout.html' import render_tw_layout, render_tw_layout_script with context %}
<!DOCTYPE html>
<html lang="{{ session.get('language', 'zh') }}">
<head>
    <script>document.documentElement.classList.add(localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>积分行为配置</title>
    <link rel="dns-prefetch" href="https://fonts.googleapis.cn">
    <link rel="dns-prefetch" href="https://fonts.gstatic.cn">
    <link rel="preconnect" href="https://fonts.googleapis.cn" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script defer src="{{ url_for('static', filename='vendor/alpine/collapse.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/alpine/alpine.min.js') }}"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#faf8f6",
                        "background-dark": "#1a1816",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark">
    {% call(slot) render_tw_layout(active_page='points_config') %}
    {% if slot == 'content' %}
    <div class="page-with-fixed-nav">
      <div class="max-w-4xl mx-auto px-4 py-6" x-data="pointsConfig()">
        <div class="flex items-center justify-between mb-6">
          <h1 class="text-xl font-bold text-slate-900 dark:text-white">积分行为配置</h1>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 dark:bg-slate-800">
              <tr>
                <th class="text-left px-4 py-3 font-medium text-slate-600 dark:text-slate-300">行为名称</th>
                <th class="text-left px-4 py-3 font-medium text-slate-600 dark:text-slate-300">分类</th>
                <th class="text-center px-4 py-3 font-medium text-slate-600 dark:text-slate-300">积分</th>
                <th class="text-center px-4 py-3 font-medium text-slate-600 dark:text-slate-300">日上限</th>
                <th class="text-center px-4 py-3 font-medium text-slate-600 dark:text-slate-300">状态</th>
                <th class="text-center px-4 py-3 font-medium text-slate-600 dark:text-slate-300">操作</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="cfg in configs" :key="cfg.id">
                <tr class="border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/50">
                  <td class="px-4 py-3">
                    <div class="font-medium text-slate-800 dark:text-white" x-text="cfg.behavior_name"></div>
                    <div class="text-xs text-slate-400" x-text="cfg.behavior_code"></div>
                  </td>
                  <td class="px-4 py-3">
                    <span class="px-2 py-0.5 rounded-full text-xs font-medium"
                      :class="catColors[cfg.category]" x-text="catLabels[cfg.category] || cfg.category"></span>
                  </td>
                  <td class="px-4 py-3 text-center font-semibold text-slate-700 dark:text-slate-200"
                    x-text="cfg.points + ' pts'"></td>
                  <td class="px-4 py-3 text-center text-slate-500"
                    x-text="cfg.daily_cap ? cfg.daily_cap + ' pts/天' : '—'"></td>
                  <td class="px-4 py-3 text-center">
                    <span :class="cfg.is_active ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400'"
                      class="px-2 py-0.5 rounded-full text-xs font-medium"
                      x-text="cfg.is_active ? '启用' : '禁用'"></span>
                  </td>
                  <td class="px-4 py-3 text-center">
                    <div class="flex items-center justify-center gap-3">
                      <button @click="openEdit(cfg)" class="text-primary hover:underline text-xs">编辑</button>
                      <button @click="toggleActive(cfg)"
                        :class="cfg.is_active ? 'text-red-500' : 'text-green-600'"
                        class="hover:underline text-xs"
                        x-text="cfg.is_active ? '禁用' : '启用'"></button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- 编辑模态框 -->
        <div x-show="editingCfg" x-cloak
          class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
          <div @click.outside="editingCfg = null"
            class="bg-white dark:bg-slate-900 rounded-xl p-6 w-full max-w-md shadow-xl">
            <h3 class="font-semibold text-slate-800 dark:text-white mb-4">编辑行为配置</h3>
            <template x-if="editingCfg">
              <div class="space-y-3">
                <div>
                  <label class="text-sm text-slate-600 dark:text-slate-400 block mb-1">行为名称</label>
                  <input x-model="editingCfg.behavior_name"
                    class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-white">
                </div>
                <div>
                  <label class="text-sm text-slate-600 dark:text-slate-400 block mb-1">积分值</label>
                  <input x-model.number="editingCfg.points" type="number" min="1"
                    class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-white">
                </div>
                <div>
                  <label class="text-sm text-slate-600 dark:text-slate-400 block mb-1">每日上限（留空=无限制）</label>
                  <input x-model.number="editingCfg.daily_cap" type="number" min="0" placeholder="留空表示无限制"
                    class="w-full px-3 py-2 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-white">
                </div>
                <div class="flex gap-3 justify-end mt-4">
                  <button @click="editingCfg = null"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">取消</button>
                  <button @click="saveEdit()"
                    class="px-4 py-2 text-sm bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">保存</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
    {% endif %}
    {% endcall %}

<script>
function getCsrfToken() {
    return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
}

function pointsConfig() {
  return {
    configs: {{ configs | tojson }},
    editingCfg: null,
    catLabels: { knowledge: '知识贡献', business: '业务推进', task: '任务达成', content: '内容创作' },
    catColors: {
      knowledge: 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
      business: 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
      task: 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-400',
      content: 'bg-orange-100 text-orange-700 dark:bg-orange-900/30 dark:text-orange-400',
    },
    openEdit(cfg) { this.editingCfg = { ...cfg }; },
    saveEdit() {
      fetch(`/points/admin/config/api/${this.editingCfg.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
        body: JSON.stringify(this.editingCfg),
      }).then(r => r.json()).then(data => {
        if (data.success) {
          const idx = this.configs.findIndex(c => c.id === this.editingCfg.id);
          if (idx >= 0) this.configs[idx] = { ...this.editingCfg };
          this.editingCfg = null;
        }
      });
    },
    toggleActive(cfg) {
      fetch(`/points/admin/config/api/${cfg.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
        body: JSON.stringify({ is_active: !cfg.is_active }),
      }).then(r => r.json()).then(data => {
        if (data.success) cfg.is_active = !cfg.is_active;
      });
    },
  };
}
</script>
{{ render_tw_layout_script() }}
</body>
</html>
