<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
  h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #f8fafc; }
  .subtitle { text-align: center; color: #94a3b8; margin-bottom: 32px; font-size: 14px; }

  .category { margin-bottom: 32px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
  .cat-header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
  .cat-name { font-size: 16px; font-weight: 600; color: #f8fafc; }
  .cat-count { font-size: 12px; color: #64748b; }
  .cat-body { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }

  .subcat-card { background: #0f172a; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #334155; transition: all 0.2s; position: relative; }
  .subcat-card:hover { border-color: #60a5fa; transform: translateY(-1px); }
  .subcat-card.has-new { border-color: #22c55e40; }
  .subcat-card.has-new:hover { border-color: #22c55e; }
  .subcat-card.no-icon { border-color: #ef444440; opacity: .7; }

  .icon-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .icon-box { background: #1e293b; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .icon-box.sz64 { width: 68px; height: 68px; }
  .icon-box.sz48 { width: 52px; height: 52px; }

  .subcat-name { font-size: 12px; color: #cbd5e1; margin-bottom: 2px; }
  .subcat-id { font-size: 10px; color: #64748b; }
  .icon-key-tag { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 10px; color: #94a3b8; background: #334155; padding: 1px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }

  .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
  .badge-new { background: #22c55e; color: #0f172a; }
  .badge-exist { background: #3b82f6; color: white; }
  .badge-reuse { background: #f59e0b; color: #0f172a; }
  .badge-none { background: #ef4444; color: white; }

  .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 24px; font-size: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }

  .stats { text-align: center; color: #94a3b8; margin-bottom: 16px; font-size: 13px; }
  .stats strong { color: #f8fafc; }
</style>

// ========== RENDER ==========
function buildSVG(iconData, size) {
  if (!iconData) return '';
  if (typeof iconData === 'string') {
    return iconData.replace(/<svg/, `<svg width="${size}" height="${size}"`);
  }
  let paths = '';
  iconData.paths.forEach(p => {
    let a = `d="${p.d}"`;
    if (p.fill) a += ` fill="${p.fill}"`;
    if (p.stroke) a += ` stroke="${p.stroke}"`;
    if (p.strokeWidth) a += ` stroke-width="${p.strokeWidth}"`;
    if (p.opacity !== undefined) a += ` opacity="${p.opacity}"`;
    if (p.strokeDasharray) a += ` stroke-dasharray="${p.strokeDasharray}"`;
    paths += `<path ${a}/>`;
  });
  return `<svg width="${size}" height="${size}" viewBox="${iconData.viewBox}">${paths}</svg>`;
}

const stats = document.createElement('div');
stats.className = 'stats';
stats.innerHTML = `共 <strong>41</strong> 个子分类：<strong style="color:#3b82f6">${totalExist}</strong> 现有 + <strong style="color:#22c55e">${totalNew}</strong> 新绘 + <strong style="color:#f59e0b">${totalReuse}</strong> 复用 + <strong style="color:#ef4444">${totalNone}</strong> 缺失`;
app.appendChild(stats);

CATEGORIES.forEach(cat => {
  const section = document.createElement('div');
  section.className = 'category';

  const header = document.createElement('div');
  header.className = 'cat-header';
  header.innerHTML = `<span class="cat-name">${cat.name}</span><span class="cat-count">${cat.subcats.length} 子分类 / ${cat.count} 产品</span>`;
  section.appendChild(header);

  const body = document.createElement('div');
  body.className = 'cat-body';

  cat.subcats.forEach(sub => {
    const iconData = ICONS[sub.icon];
    const card = document.createElement('div');
    card.className = 'subcat-card' + (sub.status === 'new' ? ' has-new' : '') + (sub.status === 'none' ? ' no-icon' : '');

    card.innerHTML = `
      <div class="icon-row">
        <div class="icon-box sz64">${buildSVG(iconData, 64)}</div>
        <div class="icon-box sz48">${buildSVG(iconData, 48)}</div>
      </div>
      <div class="subcat-name">${sub.name}</div>
      <div class="subcat-id">ID: ${sub.id} / ${sub.products}个产品</div>
      <span class="badge ${statusClass[sub.status]}">${statusLabel[sub.status]}</span>
      <div class="icon-key-tag">${sub.icon}</div>
    `;
    body.appendChild(card);
  });

  section.appendChild(body);
  app.appendChild(section);
});
</script>

</body>
</html>
