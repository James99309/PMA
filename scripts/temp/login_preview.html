<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面预览 - 红色主题</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            background-color: #fff;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
        .form-input::placeholder { color: #9ca3af; }

        .password-wrapper { position: relative; }
        .password-wrapper .form-input { padding-right: 2.75rem; }
        .password-toggle {
            position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: #9ca3af; padding: 0.25rem;
        }
        .password-toggle:hover { color: #6b7280; }

        .checkbox-round {
            appearance: none !important; -webkit-appearance: none !important;
            width: 1rem !important; height: 1rem !important;
            border: 1.5px solid #cbd5e1 !important; border-radius: 50% !important;
            background-color: #fff !important; cursor: pointer;
            transition: all 0.15s ease-in-out; flex-shrink: 0;
        }
        .checkbox-round:checked {
            background-color: #dc2626 !important; border-color: #dc2626 !important;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e") !important;
            background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
        }

        /* === 红色打勾图标 + 光芒脉冲动画 === */
        .check-icon-wrapper {
            position: relative;
            animation: checkBounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .check-icon-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.3) 0%, transparent 70%);
            animation: glowPulse 2.5s ease-in-out infinite;
        }
        .check-icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1.5px solid rgba(239, 68, 68, 0.15);
            animation: ringExpand 2.5s ease-in-out infinite;
        }

        @keyframes checkBounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes ringExpand {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0; transform: scale(1.4); }
        }

        /* === 金色"欢迎回来"文字 + 光芒扫过动画 === */
        .welcome-text {
            background: linear-gradient(135deg, #b8860b 0%, #daa520 25%, #ffd700 50%, #daa520 75%, #b8860b 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: welcomeFadeIn 0.8s ease-out 0.3s both, goldShimmer 3s ease-in-out 1.5s infinite;
        }
        @keyframes welcomeFadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes goldShimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* === 红色登录按钮 + 微光效果 === */
        .login-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #dc2626 100%);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            transform: translateY(-1px);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: btnShine 4s ease-in-out 2s infinite;
        }
        @keyframes btnShine {
            0% { left: -60%; }
            30% { left: 120%; }
            100% { left: 120%; }
        }

        /* 副标题淡入 */
        .subtitle-text {
            animation: subtitleFadeIn 0.8s ease-out 0.5s both;
        }
        @keyframes subtitleFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
    <div class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="w-full max-w-sm">
            <!-- 语言切换器 -->
            <div class="flex justify-end mb-4">
                <div class="relative">
                    <button type="button" class="flex items-center space-x-1 text-sm text-slate-900 hover:text-slate-700 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
                        </svg>
                        <span>简体中文</span>
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 地区标识 + Logo 和标题 -->
            <div class="text-center mb-8">
                <!-- 中国区国旗 -->
                <div class="flex items-center justify-center gap-2 mb-5">
                    <svg style="width:24px;height:17px;border-radius:2px;box-shadow:0 0 0 0.5px rgba(0,0,0,0.12);flex-shrink:0" viewBox="0 0 36 24"><rect width="36" height="24" fill="#DE2910"/><g fill="#FFDE00"><polygon points="6,3 6.9,5.8 9.8,5.8 7.5,7.5 8.3,10.3 6,8.6 3.7,10.3 4.5,7.5 2.2,5.8 5.1,5.8"/><polygon points="12,1.2 12.4,2.4 13.6,2.4 12.6,3.2 13,4.3 12,3.6 11,4.3 11.4,3.2 10.4,2.4 11.6,2.4"/><polygon points="14.5,3.5 14.9,4.7 16.1,4.7 15.1,5.5 15.5,6.6 14.5,5.9 13.5,6.6 13.9,5.5 12.9,4.7 14.1,4.7"/><polygon points="14.5,7 14.9,8.2 16.1,8.2 15.1,9 15.5,10.1 14.5,9.4 13.5,10.1 13.9,9 12.9,8.2 14.1,8.2"/><polygon points="12,10 12.4,11.2 13.6,11.2 12.6,12 13,13.1 12,12.4 11,13.1 11.4,12 10.4,11.2 11.6,11.2"/></g></svg>
                    <span class="text-sm font-medium text-slate-500">中国区</span>
                </div>

                <!-- 红色打勾图标 + 光芒动画 -->
                <div class="check-icon-wrapper w-14 h-14 mx-auto mb-4 bg-red-500 rounded-full flex items-center justify-center shadow-lg shadow-red-200">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>

                <!-- 金色欢迎回来 -->
                <h1 class="welcome-text text-2xl font-bold">欢迎回来</h1>
                <p class="subtitle-text text-slate-500 mt-1 text-sm">登录到 PMA 销售项目管理系统</p>
            </div>

            <!-- 登录表单 -->
            <form class="space-y-4" onsubmit="event.preventDefault()">
                <div>
                    <input type="text" class="form-input" placeholder="用户名或邮箱" value="和源通信">
                </div>
                <div>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" placeholder="密码">
                        <button type="button" class="password-toggle">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <div class="flex items-center">
                        <input type="checkbox" class="checkbox-round">
                        <label class="ml-2 text-slate-600 select-none cursor-pointer">记住我</label>
                    </div>
                    <a href="#" class="font-medium text-red-500 hover:text-red-400 transition-colors">忘记密码?</a>
                </div>

                <!-- 红色登录按钮 -->
                <button type="submit"
                        class="login-btn w-full text-white font-semibold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    登录
                </button>
            </form>
        </div>
    </div>
</body>
</html>
