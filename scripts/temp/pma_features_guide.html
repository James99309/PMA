<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMA 新功能说明书</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.cn/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.cn/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        /* Restore dark mode before paint to prevent flash */
        if (localStorage.getItem('pma-guide-dark') === 'true') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#137fec',
                        'bg-warm': '#faf8f6',
                        'bg-warm-dark': '#1a1816',
                    },
                    fontFamily: {
                        'display': ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        [x-cloak] { display: none !important; }
        html { scroll-behavior: smooth; }

        /* Feature card hover */
        .feature-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .feature-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.15);
        }
        .dark .feature-card:hover {
            box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
        }

        /* Scroll-triggered fade-in */
        .fade-in-section {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .fade-in-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Step connector line */
        .step-line {
            position: relative;
        }
        .step-line::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 28px;
            bottom: -8px;
            width: 2px;
            background: linear-gradient(to bottom, currentColor 60%, transparent);
            opacity: 0.15;
        }
        .step-line:last-child::before {
            display: none;
        }

        /* Hero gradient */
        .hero-gradient {
            background: linear-gradient(135deg, #137fec 0%, #6366f1 50%, #a855f7 100%);
        }

        /* Screenshot placeholder styling */
        .screenshot-placeholder {
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0,0,0,0.02) 10px,
                rgba(0,0,0,0.02) 20px
            );
        }
        .dark .screenshot-placeholder {
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.02) 10px,
                rgba(255,255,255,0.02) 20px
            );
        }

        /* Lightbox */
        .lightbox-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Pulse animation for active nav item */
        @keyframes gentle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .nav-active-pulse {
            animation: gentle-pulse 2s ease-in-out infinite;
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #137fec 0%, #6366f1 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Carousel text fade transition */
        .carousel-text-enter {
            animation: carouselFadeIn 0.3s ease-out;
        }
        @keyframes carouselFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-bg-warm dark:bg-bg-warm-dark min-h-screen transition-colors duration-300" x-data="featureGuide()" x-cloak>

    <!-- Tailwind CDN safelist: dynamic color classes used via Alpine.js bindings -->
    <div class="hidden
        bg-purple-100 bg-purple-500 bg-purple-900/30 text-purple-400 text-purple-500 text-purple-600 border-purple-200 ring-purple-500 dark:bg-purple-900/30 dark:text-purple-400
        bg-yellow-100 bg-yellow-500 bg-yellow-900/30 text-yellow-400 text-yellow-500 text-yellow-600 border-yellow-200 ring-yellow-500 dark:bg-yellow-900/30 dark:text-yellow-400
        bg-blue-100 bg-blue-500 bg-blue-900/30 text-blue-400 text-blue-500 text-blue-600 border-blue-200 ring-blue-500 dark:bg-blue-900/30 dark:text-blue-400
        bg-cyan-100 bg-cyan-500 bg-cyan-900/30 text-cyan-400 text-cyan-500 text-cyan-600 border-cyan-200 ring-cyan-500 dark:bg-cyan-900/30 dark:text-cyan-400
        bg-green-100 bg-green-500 bg-green-900/30 text-green-400 text-green-500 text-green-600 border-green-200 ring-green-500 dark:bg-green-900/30 dark:text-green-400
        bg-orange-100 bg-orange-500 bg-orange-900/30 text-orange-400 text-orange-500 text-orange-600 border-orange-200 ring-orange-500 dark:bg-orange-900/30 dark:text-orange-400
        bg-indigo-100 bg-indigo-500 bg-indigo-900/30 text-indigo-400 text-indigo-500 text-indigo-600 border-indigo-200 ring-indigo-500 dark:bg-indigo-900/30 dark:text-indigo-400
        bg-red-100 bg-red-500 bg-red-900/30 text-red-400 text-red-500 text-red-600 border-red-200 ring-red-500 dark:bg-red-900/30 dark:text-red-400
    "></div>

    <!-- Lightbox overlay -->
    <div x-show="lightboxSrc" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="lightboxSrc = null"
         class="fixed inset-0 z-[100] bg-black/80 lightbox-backdrop flex items-center justify-center p-4 cursor-zoom-out">
        <img :src="lightboxSrc" class="max-w-full max-h-[90vh] rounded-xl shadow-2xl object-contain" @click.stop>
        <button @click="lightboxSrc = null" class="absolute top-4 right-4 w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200/60 dark:border-slate-700/60 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 hero-gradient rounded-lg flex items-center justify-center shadow-lg shadow-primary/20">
                        <span class="material-symbols-outlined text-white text-xl fill">auto_awesome</span>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">PMA 新功能说明书</h1>
                        <p class="text-[11px] text-slate-400 dark:text-slate-500 -mt-0.5">2026年第一季度更新 &middot; 共8项新功能</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <!-- Dark mode toggle -->
                    <button @click="toggleDark()" class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" :title="dark ? '切换浅色模式' : '切换深色模式'">
                        <span class="material-symbols-outlined text-xl" x-text="dark ? 'light_mode' : 'dark_mode'"></span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">

        <!-- Hero Section -->
        <section class="fade-in-section relative overflow-hidden bg-gradient-to-br from-primary/5 via-indigo-500/5 to-purple-500/5 dark:from-primary/10 dark:via-indigo-500/10 dark:to-purple-500/10 border border-primary/10 dark:border-primary/20 rounded-3xl p-8 sm:p-12 mb-10">
            <div class="absolute top-0 right-0 w-72 h-72 bg-gradient-to-bl from-primary/10 to-transparent rounded-full -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-purple-500/10 to-transparent rounded-full translate-y-1/3 -translate-x-1/4 pointer-events-none"></div>
            <div class="relative">
                <div class="flex items-center gap-2 mb-4">
                    <span class="material-symbols-outlined text-primary fill text-3xl">celebration</span>
                    <span class="px-3 py-1 text-xs font-bold bg-primary/10 text-primary rounded-full tracking-wide">2026 Q1 更新</span>
                </div>
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-900 dark:text-white mb-4 leading-tight">
                    PMA <span class="gradient-text">新功能说明书</span>
                </h2>
                <p class="text-base sm:text-lg text-slate-600 dark:text-slate-300 max-w-3xl leading-relaxed mb-6">
                    2026年第一季度，PMA 系统迎来重大更新，新增 <strong class="text-slate-900 dark:text-white">8 项核心功能</strong>，涵盖 AI 智能助手、积分体系、资源共享、绩效分析等领域，全面提升工作效率和业务管理能力。
                </p>
                <p class="text-sm text-slate-500 dark:text-slate-400">
                    点击下方功能卡片查看详细说明
                </p>
            </div>
        </section>

        <!-- Overview Cards Grid -->
        <section class="fade-in-section mb-16">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary fill">grid_view</span>
                    功能概览
                </h3>
                <span class="text-xs text-slate-400 dark:text-slate-500 hidden sm:inline">点击卡片跳转到详细说明</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                <template x-for="(f, idx) in features" :key="f.id">
                    <div class="feature-card bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 cursor-pointer group relative overflow-hidden"
                         @click="scrollToFeature(f.id)">
                        <!-- Subtle top accent -->
                        <div class="absolute top-0 left-0 right-0 h-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                             :class="'bg-gradient-to-r from-' + f.color + '-400 to-' + f.color + '-600'"></div>
                        <!-- Number badge -->
                        <div class="absolute top-4 right-4 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold opacity-40 group-hover:opacity-100 transition-opacity"
                             :class="'bg-' + f.color + '-100 dark:bg-' + f.color + '-900/30 text-' + f.color + '-600 dark:text-' + f.color + '-400'"
                             x-text="idx + 1"></div>
                        <!-- Icon -->
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4 transition-transform duration-300 group-hover:scale-110"
                             :class="'bg-' + f.color + '-100 dark:bg-' + f.color + '-900/30'">
                            <span class="material-symbols-outlined text-2xl fill"
                                  :class="'text-' + f.color + '-600 dark:text-' + f.color + '-400'"
                                  x-text="f.icon"></span>
                        </div>
                        <!-- Title -->
                        <h4 class="font-bold text-slate-900 dark:text-white text-sm mb-2" x-text="f.title"></h4>
                        <!-- Summary -->
                        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed mb-4" x-text="f.summary"></p>
                        <!-- Keywords -->
                        <div class="flex flex-wrap gap-1.5">
                            <template x-for="kw in f.keywords" :key="kw">
                                <span class="px-2 py-0.5 text-[10px] font-medium rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400" x-text="kw"></span>
                            </template>
                        </div>
                        <!-- Bottom arrow -->
                        <div class="flex items-center justify-end mt-4 text-primary opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-xs font-medium">查看详情</span>
                            <span class="material-symbols-outlined text-sm ml-0.5">arrow_forward</span>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Detailed Sections -->
        <section class="space-y-10">
            <template x-for="(f, idx) in features" :key="f.id">
                <div :id="'detail-' + f.id" class="fade-in-section bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden scroll-mt-24 shadow-sm">

                    <!-- Section Header -->
                    <div class="p-6 sm:p-8 border-b border-slate-100 dark:border-slate-800">
                        <div class="flex items-start gap-4">
                            <div class="w-14 h-14 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-sm"
                                 :class="'bg-' + f.color + '-100 dark:bg-' + f.color + '-900/30'">
                                <span class="material-symbols-outlined text-3xl fill"
                                      :class="'text-' + f.color + '-600 dark:text-' + f.color + '-400'"
                                      x-text="f.icon"></span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="px-2.5 py-0.5 text-[10px] font-bold rounded-full text-white shadow-sm"
                                          :class="'bg-' + f.color + '-500'"
                                          x-text="'#' + (idx + 1)"></span>
                                    <span class="text-xs text-slate-400 dark:text-slate-500 font-medium" x-text="f.title_en"></span>
                                </div>
                                <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white" x-text="f.title"></h2>
                            </div>
                        </div>
                    </div>

                    <!-- Content Area -->
                    <div class="p-6 sm:p-8">

                        <!-- Main two-column layout -->
                        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">

                            <!-- LEFT: Hero Image + 2x2 Scenario Cards -->
                            <div class="lg:col-span-3 space-y-4">

                                <!-- Hero Image -->
                                <div class="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800" style="aspect-ratio:16/10;">
                                    <img :src="'guide_images/' + f.heroImg"
                                         :alt="f.title"
                                         class="w-full h-full object-cover"
                                         style="display:none;"
                                         @load="$el.style.display='block'; $el.nextElementSibling.style.display='none'"
                                         @error="$el.style.display='none'; $el.nextElementSibling.style.display='flex'">
                                    <div class="w-full h-full flex flex-col items-center justify-center gap-2">
                                        <span class="material-symbols-outlined text-4xl text-slate-300 dark:text-slate-600">panorama</span>
                                        <span class="text-xs text-slate-400 dark:text-slate-500" x-text="f.heroImg"></span>
                                    </div>
                                </div>

                                <!-- 2x2 Scenario Cards (each with its own description) -->
                                <div>
                                    <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2 uppercase tracking-wider">
                                        <span class="material-symbols-outlined text-primary text-lg">lightbulb</span>
                                        使用场景
                                    </h3>
                                    <div class="grid grid-cols-2 gap-3">
                                        <template x-for="(s, si) in f.scenarios" :key="s.img">
                                            <div class="rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50">
                                                <div class="relative bg-slate-100 dark:bg-slate-800" style="aspect-ratio:16/10;">
                                                    <img :src="'guide_images/' + s.img"
                                                         :alt="s.title"
                                                         class="w-full h-full object-cover"
                                                         style="display:none;"
                                                         @load="$el.style.display='block'; $el.nextElementSibling.style.display='none'"
                                                         @error="$el.style.display='none'; $el.nextElementSibling.style.display='flex'">
                                                    <div class="w-full h-full flex flex-col items-center justify-center gap-1">
                                                        <span class="material-symbols-outlined text-xl text-slate-300 dark:text-slate-600">photo_camera</span>
                                                        <span class="text-[9px] text-slate-400 dark:text-slate-500" x-text="s.img"></span>
                                                    </div>
                                                </div>
                                                <div class="p-3">
                                                    <p class="text-xs font-semibold mb-1"
                                                       :class="'text-' + f.color + '-600 dark:text-' + f.color + '-400'"
                                                       x-text="s.title"></p>
                                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed" x-text="s.desc"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <!-- RIGHT: Description + Entry + Steps -->
                            <div class="lg:col-span-2 space-y-5">

                                <!-- Description -->
                                <section>
                                    <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2 uppercase tracking-wider">
                                        <span class="material-symbols-outlined text-primary text-lg">info</span>
                                        功能介绍
                                    </h3>
                                    <div class="space-y-2">
                                        <template x-for="p in f.description" :key="p">
                                            <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed" x-text="p"></p>
                                        </template>
                                    </div>
                                </section>

                                <!-- Entry Point -->
                                <section>
                                    <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2 uppercase tracking-wider">
                                        <span class="material-symbols-outlined text-primary text-lg">location_on</span>
                                        操作入口
                                    </h3>
                                    <div class="bg-primary/5 dark:bg-primary/10 border border-primary/10 dark:border-primary/20 rounded-lg p-3 space-y-2">
                                        <p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed" x-text="f.entry"></p>
                                    </div>
                                </section>

                                <!-- Steps -->
                                <section>
                                    <h3 class="text-sm font-semibold text-slate-900 dark:text-white mb-3 flex items-center gap-2 uppercase tracking-wider">
                                        <span class="material-symbols-outlined text-primary text-lg">list_alt</span>
                                        操作步骤
                                    </h3>
                                    <ol class="space-y-2.5">
                                        <template x-for="(step, i) in f.steps" :key="i">
                                            <li class="step-line flex items-start gap-2.5">
                                                <span class="flex-shrink-0 w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center"
                                                      :class="'bg-' + f.color + '-100 dark:bg-' + f.color + '-900/30 text-' + f.color + '-600 dark:text-' + f.color + '-400'"
                                                      x-text="i + 1"></span>
                                                <span class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed pt-0.5" x-text="step"></span>
                                            </li>
                                        </template>
                                    </ol>
                                </section>

                                <!-- Back to top -->
                                <div class="pt-2">
                                    <button @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
                                            class="text-xs text-primary hover:text-primary/70 font-medium flex items-center gap-1 transition-colors">
                                        <span class="material-symbols-outlined text-sm">arrow_upward</span>
                                        返回顶部
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 mt-16 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-7 h-7 hero-gradient rounded-md flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-sm fill">auto_awesome</span>
                    </div>
                    <p class="text-sm text-slate-500 dark:text-slate-400">
                        &copy; 2026 PMA System
                    </p>
                </div>
                <p class="text-xs text-slate-400 dark:text-slate-500">
                    如需帮助请联系系统管理员
                </p>
            </div>
        </div>
    </footer>

    <!-- Back to top floating button -->
    <button x-show="showBackToTop"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-4"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-4"
            @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
            class="fixed bottom-6 right-6 z-40 w-11 h-11 bg-primary text-white rounded-full shadow-lg shadow-primary/30 flex items-center justify-center hover:bg-primary/90 hover:shadow-xl hover:shadow-primary/40 transition-all duration-200">
        <span class="material-symbols-outlined text-xl">arrow_upward</span>
    </button>

    <script>
    function featureGuide() {
        return {
            dark: localStorage.getItem('pma-guide-dark') === 'true',
            showBackToTop: false,
            lightboxSrc: null,

            features: [
                {
                    id: 'ai-chat',
                    title: 'AI 智能助手',
                    title_en: 'AI Chat Assistant',
                    icon: 'smart_toy',
                    color: 'purple',
                    heroImg: 'ai-chat_main.png',
                    summary: '内置 AI 聊天助手，支持自然语言查询业务数据、自动翻译、辅助创建表单。',
                    keywords: ['智能对话', '数据查询', '自动翻译', '表单创建'],
                    description: [

            init() {
                // Scroll listener for back-to-top button
                window.addEventListener('scroll', () => {
                    this.showBackToTop = window.scrollY > 400;
                });

                // Intersection Observer for fade-in animations
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                        }
                    });
                }, {
                    threshold: 0.08,
                    rootMargin: '0px 0px -40px 0px'
                });

                // Observe all fade-in sections after Alpine renders
                this.$nextTick(() => {
                    document.querySelectorAll('.fade-in-section').forEach(el => {
                        observer.observe(el);
                    });
                });

                // Close lightbox on Escape
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.lightboxSrc = null;
                });
            },

            toggleDark() {
                this.dark = !this.dark;
                document.documentElement.classList.toggle('dark');
                document.documentElement.classList.toggle('light');
                localStorage.setItem('pma-guide-dark', this.dark);
            },

            scrollToFeature(id) {
                this.$nextTick(() => {
                    const el = document.getElementById('detail-' + id);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            }
        };
