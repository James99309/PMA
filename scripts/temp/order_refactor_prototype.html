<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
        .material-symbols-outlined { font-size: 20px; vertical-align: middle; }
        .msi { font-size: 18px; }
        /* 实际系统顶栏 */
        .top-bar { background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .top-bar-search { background: #f3f4f6; border-radius: 8px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; width: 400px; color: #9ca3af; font-size: 14px; }
        .top-bar-icons { display: flex; align-items: center; gap: 16px; color: #6b7280; }
        /* 卡片 */
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; }
        .card-header { padding: 20px 24px 0; }
        .card-body { padding: 16px 24px 20px; }
        /* 统计卡片 - 匹配实际UI */
        .stat-card { border: 1.5px solid; border-radius: 12px; padding: 16px; cursor: pointer; min-width: 0; transition: all .15s; }
        .stat-card:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        .stat-card .stat-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .stat-card .stat-label { font-size: 13px; color: #6b7280; margin-bottom: 2px; }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; }
        /* Tab */
        .tab-bar { display: flex; border-bottom: 1px solid #e5e7eb; padding: 0 24px; }
        .tab-item { padding: 12px 16px; font-size: 14px; font-weight: 500; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; }
        .tab-item:hover { color: #3b82f6; }
        .tab-item.active { color: #3b82f6; border-bottom-color: #3b82f6; }
        /* 徽章 */
        .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
        .badge-blue { background: #dbeafe; color: #2563eb; }
        .badge-green { background: #dcfce7; color: #16a34a; }
        .badge-yellow { background: #fef9c3; color: #ca8a04; }
        .badge-purple { background: #f3e8ff; color: #9333ea; }
        .badge-red { background: #fee2e2; color: #dc2626; }
        .badge-cyan { background: #cffafe; color: #0891b2; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
        /* 表格 */
        .data-table { width: 100%; font-size: 14px; }
        .data-table thead th { text-align: left; padding: 12px 16px; font-size: 12px; color: #9ca3af; font-weight: 500; border-bottom: 1px solid #e5e7eb; }
        .data-table tbody td { padding: 16px; border-bottom: 1px solid #f3f4f6; }
        .data-table tbody tr:hover { background: #f9fafb; }
        /* 进度条 */
        .progress-bar { width: 80px; height: 4px; background: #e5e7eb; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 6px; }
        .progress-fill { height: 100%; border-radius: 2px; }
        /* NEW标记 */
        .new-tag { position: relative; }
        .new-tag::after { content: 'NEW'; position: absolute; top: -10px; right: -10px; background: #ef4444; color: white; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; letter-spacing: .5px; }
        .mod-tag { position: relative; }
        .mod-tag::after { content: '改'; position: absolute; top: -10px; right: -10px; background: #3b82f6; color: white; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
        /* 面包屑 */
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6b7280; margin-bottom: 8px; }
        .breadcrumb a { color: #3b82f6; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        /* 时间线 */
        .timeline-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; }
        .timeline-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
        .timeline-line { width: 2px; background: #e5e7eb; margin-left: 9px; min-height: 24px; }
        /* 筛选区 */
        .filter-bar { display: flex; align-items: center; gap: 12px; padding: 16px 24px; background: #fafbfc; border-bottom: 1px solid #e5e7eb; }
        .filter-input { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 14px; font-size: 14px; outline: none; }
        .filter-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.15); }
        .filter-select { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 14px; font-size: 14px; background: white; outline: none; appearance: auto; }
        .btn-primary { background: #3b82f6; color: white; border: none; border-radius: 8px; padding: 8px 20px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary:hover { background: #2563eb; }
        .btn-outline { background: white; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: #374151; }
        .btn-outline:hover { background: #f9fafb; }
        /* 流程选择器 */
        .journey-card { cursor: pointer; transition: all 0.15s; border: 1.5px solid #e5e7eb; }
        .journey-card:hover { border-color: #93c5fd; transform: translateY(-1px); }
        .journey-card.selected { border-color: #3b82f6; background: #eff6ff; }
        /* 步骤指示器 */
        .step-dot { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .step-dot.active { background: #3b82f6; color: white; }
        .step-dot.done { background: #10b981; color: white; }
        .step-dot.pending { background: #e5e7eb; color: #6b7280; }
        /* 模态框遮罩 */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.25); z-index: 20; display: flex; justify-content: center; padding-top: 20px; border-radius: 0 0 12px 12px; }
        .modal-box { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.15); width: 700px; max-height: 540px; overflow-y: auto; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; background: #fafbfc; position: sticky; top: 0; border-radius: 16px 16px 0 0; z-index: 1; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 8px; background: #fafbfc; position: sticky; bottom: 0; border-radius: 0 0 16px 16px; }

        .shipment-item:hover { border-color: #93c5fd; }
    </style>
</head>

    <div style="padding:20px 24px 16px"><h1 style="font-size:22px;font-weight:700">结算管理</h1></div>
    <div style="padding:0 24px 16px">
        <div style="background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
            <span class="material-symbols-outlined" style="color:#0891b2">info</span>
            <div><div style="font-size:14px;font-weight:600;color:#0e7490">从采购订单 PUO202507-004 跳转</div><div style="font-size:12px;color:#6b7280">已筛选显示关联的批价单：PRC202602-001</div></div>
        </div>
        <table class="data-table">
            <thead><tr><th>结算单号</th><th>批价单号</th><th>分销商</th><th style="text-align:right">金额</th><th style="text-align:center">结算状态</th><th style="text-align:center">操作</th></tr></thead>
            <tbody>
                <tr><td style="font-weight:600">STL202602-001</td><td style="color:#3b82f6">PRC202602-001</td><td>深圳XX代理商</td><td style="text-align:right;font-weight:500">¥239,940</td><td style="text-align:center"><span class="badge badge-yellow">待结算</span></td><td style="text-align:center"><button style="color:#3b82f6;font-size:13px;background:none;border:none;cursor:pointer;text-decoration:underline">执行结算</button></td></tr>
            </tbody>
        </table>
    </div>
</div>`
};

// ==================== 流程定义 ====================
const journeys = {
    1: { name:'创建备货订单', steps:[
        {label:'采购订单列表', page:'listOrders', desc:'点击右上角 "新建采购订单" 按钮'},
        {label:'填写订单信息', page:'createFormStocking', desc:'订单来源选择"备货"，填写供应商和产品明细'},
        {label:'订单详情页', page:'detailStocking', desc:'创建成功，跳转到详情页，显示来源=备货'}
    ]},
    2: { name:'从批价单导入创建', steps:[
        {label:'采购订单列表', page:'listOrders', desc:'点击 "新建采购订单"'},
        {label:'点击从批价单导入', page:'createFormStocking', desc:'在创建表单中点击 "从批价单导入" 按钮'},
        {label:'选择批价单', page:'pricingSelector', desc:'弹出批价单选择器，勾选一个或多个批价单'},
        {label:'自动填充产品', page:'createFormPricingFilled', desc:'产品明细自动填充，来源自动标记为"批价关联"'},
        {label:'订单详情页', page:'detailPricingLinked', desc:'创建成功，显示关联批价单和"可结算"标记'}
    ]},
    3: { name:'添加发货批次', steps:[
        {label:'订单详情页', page:'detailStocking', desc:'滚动到"发货批次"卡片，点击 "新增发货"'},
        {label:'填写发货信息', page:'shipmentModal', desc:'填写物流/包装/联系人信息，选择发货产品数量'},
        {label:'发货记录更新', page:'detailStocking', desc:'确认后，发货批次列表新增一条记录'}
    ]},
    4: { name:'发货总览', steps:[
        {label:'采购订单列表', page:'listOrders', desc:'点击 "发货总览" Tab 切换视图'},
        {label:'发货总览', page:'listShipments', desc:'显示所有订单的发货批次，可按状态筛选'},
        {label:'跳转到订单', page:'detailStocking', desc:'点击PO单号，跳转到对应订单详情页'}
    ]},
    5: { name:'批价关联→结算', steps:[
        {label:'批价关联订单详情', page:'detailPricingLinked', desc:'批价关联订单已入库，显示"可结算"标记和结算按钮'},
        {label:'跳转结算管理', page:'settlementPage', desc:'点击"前往结算管理"，自动筛选关联的批价单'}
    ]}
};

// ==================== 交互逻辑 ====================
let curJ = 1, curS = 0;

function showJourney(n) {
    curJ = n; curS = 0;
    document.querySelectorAll('.journey-card').forEach((el,i) => {
        el.classList.toggle('selected', i===n-1);
    });
    render();
}

function render() {
    const j = journeys[curJ], s = j.steps[curS];
    // 步骤点
    document.getElementById('stepDots').innerHTML = j.steps.map((st,i) => `
        <div style="display:flex;align-items:center;gap:6px;cursor:pointer" onclick="goTo(${i})">
            <span class="step-dot ${i===curS?'active':i<curS?'done':'pending'}">${i<curS?'✓':i+1}</span>
            <span style="font-size:13px;font-weight:${i===curS?600:400};color:${i===curS?'#1e3a5f':i<curS?'#16a34a':'#9ca3af'}">${st.label}</span>
            ${i<j.steps.length-1?'<span style="color:#d1d5db;margin:0 4px">→</span>':''}
        </div>
    `).join('');
    // 导航按钮
    document.getElementById('stepNav').innerHTML = `
        ${curS>0?'<button class="btn-outline" onclick="prev()" style="font-size:13px"><span class="material-symbols-outlined msi">arrow_back</span>上一步</button>':''}
        ${curS<j.steps.length-1?'<button class="btn-primary" onclick="next()" style="font-size:13px">下一步<span class="material-symbols-outlined msi">arrow_forward</span></button>':'<span style="color:#16a34a;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px"><span class="material-symbols-outlined msi">check_circle</span>流程结束</span>'}
    `;
    // 提示
    document.getElementById('stepHintText').innerHTML = `<strong>步骤 ${curS+1}/${j.steps.length}：</strong>${s.desc}`;
    // 页面
    document.getElementById('pageContent').innerHTML = pages[s.page];
    // 绑定交互
    bind();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function next() { if(curS < journeys[curJ].steps.length-1) { curS++; render(); } }
function prev() { if(curS > 0) { curS--; render(); } }
function goTo(i) { curS = i; render(); }

function bind() {
    const on = (id, fn) => { const el=document.getElementById(id); if(el) el.onclick=fn; };
    on('btnCreate', next);
    on('btnShipmentTab', () => { if(curJ===4) next(); });
    on('btnOrdersTab2', prev);
    on('btnSubmitCreate', next);
    on('btnSubmitPricing', next);
    on('btnCancelCreate', prev);
    on('btnImportPricing', () => { if(curJ===2) next(); });
    on('btnConfirmImport', next);
    on('btnBackFromDetail', prev);
    on('btnBackFromDetail2', prev);
    on('btnAddShipment', () => { if(curJ===3) next(); });
    on('btnConfirmShipment', next);
    on('btnCancelShipment', prev);
    on('btnGoSettlement', () => { if(curJ===5) next(); });
    on('btnGoSettlement2', () => { if(curJ===5) next(); });
    const r2 = document.getElementById('rowPO2');
    if(r2 && curJ===5) r2.onclick = next;
}

showJourney(1);
</script>
</body>
</html>
