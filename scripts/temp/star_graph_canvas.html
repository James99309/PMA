<script>
// ============================================================
// Canvas 设置
// ============================================================
let W = window.innerWidth, H = window.innerHeight;
const dpr = window.devicePixelRatio || 1;

const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
const mainCanvas = document.getElementById('mainCanvas');
const ctx = mainCanvas.getContext('2d');

function resizeCanvases() {
  W = window.innerWidth; H = window.innerHeight;
  [bgCanvas, mainCanvas].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
}
resizeCanvases();

// ============================================================
// 星空背景（独立 Canvas，只在需要时重绘）
// ============================================================
function paintNebula() {
  const c = bgCtx;
  c.fillStyle = '#080b18'; c.fillRect(0,0,W,H);
  [
    {x:W*0.15,y:H*0.3,r:W*0.45,c:['rgba(80,40,120,0.18)','rgba(40,20,80,0.06)','transparent']},
    {x:W*0.7,y:H*0.25,r:W*0.5,c:['rgba(30,50,130,0.2)','rgba(20,30,90,0.08)','transparent']},
    {x:W*0.5,y:H*0.7,r:W*0.4,c:['rgba(60,30,100,0.12)','rgba(30,20,70,0.04)','transparent']},
    {x:W*0.85,y:H*0.65,r:W*0.35,c:['rgba(40,50,140,0.15)','rgba(25,30,100,0.05)','transparent']},
    {x:W*0.3,y:H*0.8,r:W*0.3,c:['rgba(90,40,110,0.1)','rgba(50,25,75,0.03)','transparent']},
  ].forEach(n=>{
    const g=c.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c[0]);g.addColorStop(0.5,n.c[1]);g.addColorStop(1,n.c[2]);
    c.fillStyle=g; c.fillRect(0,0,W,H);
  });
  c.save(); c.translate(W*0.1,H*0.9); c.rotate(-0.6);
  const mg=c.createLinearGradient(0,-80,0,80);
  mg.addColorStop(0,'transparent'); mg.addColorStop(0.3,'rgba(120,100,160,0.06)');
  mg.addColorStop(0.5,'rgba(140,120,180,0.09)'); mg.addColorStop(0.7,'rgba(120,100,160,0.06)');
  mg.addColorStop(1,'transparent');
  c.fillStyle=mg; c.fillRect(-100,-120,W*1.6,240); c.restore();
}

const bgStars = Array.from({length:600},()=>({
  x:Math.random()*W, y:Math.random()*H,
  r:Math.random()<0.92?Math.random()*0.8+0.2:Math.random()*1.5+0.8,
  base:Math.random()*0.4+0.15, speed:Math.random()*0.015+0.003,
  phase:Math.random()*Math.PI*2, hasCross:Math.random()<0.04,
}));

function drawBg() {
  bgCtx.clearRect(0,0,W,H); paintNebula();
  const t=Date.now()/1000;
  bgStars.forEach(s=>{
    const f=Math.sin(t*s.speed*8+s.phase)*0.25+0.75, a=s.base*f;
    bgCtx.beginPath(); bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(200,210,255,${a})`; bgCtx.fill();
    if(s.hasCross){
      const len=s.r*6*f;
      bgCtx.strokeStyle=`rgba(210,220,255,${a*0.3})`; bgCtx.lineWidth=0.5;
      bgCtx.beginPath(); bgCtx.moveTo(s.x-len,s.y); bgCtx.lineTo(s.x+len,s.y);
      bgCtx.moveTo(s.x,s.y-len); bgCtx.lineTo(s.x,s.y+len); bgCtx.stroke();
    }
  });
}

const savedPositions = {};  // 记录节点位置，保证已探索路径稳定

function saveCurrentPositions(){
  visNodes.forEach(d=>{
    if(d.x!=null && d.y!=null) savedPositions[d.id]={x:d.x, y:d.y};
  });
}

function getNeighbors(id){
  const s=new Set();
  ALL_LINKS.forEach(l=>{
    const a=l.source.id??l.source, b=l.target.id??l.target;
    if(a===id)s.add(b); if(b===id)s.add(a);
  }); return s;
}
function refreshNb(){ selectedNeighbors=selectedId?getNeighbors(selectedId):new Set(); }

let visNodes=[], visLinks=[];

function buildGraph(){
  const vis=new Set();
  const vl=[];
  vis.add(centerId);
  expanded.forEach(nid=>{
    vis.add(nid);
    ALL_LINKS.forEach(l=>{
      const s=l.source.id??l.source, t=l.target.id??l.target;
      if(s===nid){vis.add(t);vl.push({source:s,target:t,label:l.label});}
      if(t===nid){vis.add(s);vl.push({source:s,target:t,label:l.label});}
    });
  });
  const seen=new Set();
  const ul=vl.filter(l=>{const k=[l.source,l.target].sort().join('|');if(seen.has(k))return false;seen.add(k);return true;});

  visNodes=[...vis].map(id=>ALL_NODES[id]).filter(Boolean).map(n=>({
    ...n,
    isCenter:n.id===centerId,
    hasMore:ALL_LINKS.some(l=>{
      const s=l.source.id??l.source, t=l.target.id??l.target;
      const o=s===n.id?t:(t===n.id?s:null);
      return o&&!vis.has(o);
    }),
  }));
  visLinks=ul;
}

function isLeaf(d){ return d.nodeType==='workitem'||d.nodeType==='task'||d.nodeType==='product'||!d.hasMore; }

// ============================================================
// 视觉状态
// ============================================================
// 非中心项目判定（全局函数）
function isOtherProject(d){
  return d.nodeType==='project' && String(d.id)!==String(centerId);
}

// ============================================================
// 视觉状态 — 简化为3层：选中 > 激活(点过) > 其他(暗)
// 非中心项目：始终暗，只 hover 亮
// 邻居不自动亮 — 只有 hover 才亮
// ============================================================
function calcVis(d){
  const isSel = (d.id===selectedId);
  const isAct = activated.has(d.id);
  const isHov = (d.id===hoveredId);
  const isCtr = d.isCenter;
  const base  = BASE_R[d.nodeType]||3;
  const leaf  = isLeaf(d);
  const otherProj = isOtherProject(d);
  let r,op,labelOp,subOp,glowR,glowOp,crossLen,crossOp,lw,ls;

  // ─── 优先级1：非中心项目 → 始终暗淡 ───
  if(otherProj){
    r=base*0.25; op=0.12; labelOp=0.15; subOp=0.06;
    glowR=base*0.8; glowOp=0.02; crossLen=base*0.5; crossOp=0.01;
    lw=400; ls=8;
    if(isHov){
      r=base*0.65; op=0.65; labelOp=0.75; subOp=0.35;
      glowR=base*2.5; glowOp=0.12; crossLen=base*2.5; crossOp=0.1;
      lw=500; ls=10;
    }
    if(searchQuery && !d.name.toLowerCase().includes(searchQuery)){
      op*=0.08; labelOp*=0.08; subOp=0; glowOp*=0.08; crossOp*=0.08;
    }
    return {r,op,labelOp,subOp,glowR,glowOp,crossLen,crossOp,lw,ls};
  }

  // ─── 优先级2：当前选中（刚点击的节点）───
  if(isSel&&!leaf){
    r=base*2.2; op=1; labelOp=1; subOp=0.6;
    glowR=base*8; glowOp=0.35; crossLen=base*10; crossOp=0.4;
    lw=700; ls=13;
  } else if(isSel&&leaf){
    r=base*1.0; op=1; labelOp=1; subOp=0.6;
    glowR=base*6; glowOp=0.3; crossLen=base*6; crossOp=0.35;
    lw=700; ls=12;
  }
  // ─── 优先级3：已激活（之前点击过的路径节点）───
  else if(isAct){
    r=base*0.85; op=0.8; labelOp=0.6; subOp=0.2;
    glowR=base*3; glowOp=0.12; crossLen=base*3; crossOp=0.1;
    lw=500; ls=10;
  }
  // ─── 优先级4：中心项目（无选中时）───
  else if(isCtr&&!selectedId){
    r=base*1.5; op=0.95; labelOp=0.85; subOp=0.4;
    glowR=base*7; glowOp=0.3; crossLen=base*8; crossOp=0.3;
    lw=600; ls=12;
  }
  // ─── 优先级5：所有其他可见节点 → 暗淡 ───
  else {
    r=base*0.28; op=0.15; labelOp=0.1; subOp=0;
    glowR=base*0.8; glowOp=0.02; crossLen=base*0.6; crossOp=0.01;
    lw=400; ls=8;
  }

  // hover 增亮（任何非选中节点）
  if(isHov&&!isSel){
    r=Math.max(r*1.4, base*1.0);
    op=Math.min(op+0.3, 1); labelOp=Math.min(labelOp+0.45, 1);
    subOp=Math.max(subOp, 0.5);
    glowR=Math.max(glowR*1.5, base*3); glowOp=Math.min(glowOp+0.18, 0.4);
    crossLen=Math.max(crossLen*1.3, base*3); crossOp=Math.min(crossOp+0.2, 0.4);
    lw=Math.max(lw,600); ls=Math.max(ls,11);
  }

  // 搜索过滤
  if(searchQuery && !d.name.toLowerCase().includes(searchQuery)){
    op*=0.08; labelOp*=0.08; subOp=0; glowOp*=0.08; crossOp*=0.08;
  }

  return {r,op,labelOp,subOp,glowR,glowOp,crossLen,crossOp,lw,ls};
}

function starColor(d){
  if(d.nodeType==='member') return {r:255,g:232,b:192};   // 暖黄色
  if(d.nodeType==='quotation') return {r:255,g:220,b:160}; // 淡金色
  if(d.nodeType==='workitem') return {r:176,g:200,b:232};  // 淡蓝灰色
  if(d.nodeType==='task') return {r:180,g:230,b:200};      // 淡绿色
  if(d.nodeType==='product') return {r:200,g:180,b:230};   // 淡紫色
  if(d.nodeType==='contact') return {r:180,g:210,b:245};   // 浅蓝色
  return {r:216,g:228,b:255}; // project, company: 蓝白色
}

// ============================================================
// 相机（平移+缩放）
// ============================================================
let camX=0, camY=0, camScale=1;

function screenToWorld(sx,sy){
  return { x:(sx-W/2)/camScale-camX, y:(sy-H/2)/camScale-camY };
}
function worldToScreen(wx,wy){
  return { x:(wx+camX)*camScale+W/2, y:(wy+camY)*camScale+H/2 };
}

// ============================================================
// D3 力模拟
// ============================================================
let sim = d3.forceSimulation()
  .force('charge', d3.forceManyBody().strength(d=>d.isCenter?-600:-250))
  .force('center', d3.forceCenter(0,0).strength(0.04))
  .force('collision', d3.forceCollide().radius(d=>(BASE_R[d.nodeType]||3)*4+35))
  .force('link', d3.forceLink().id(d=>d.id)
    .distance(d=>{
      const sn=ALL_NODES[d.source.id??d.source], tn=ALL_NODES[d.target.id??d.target];
      if(sn?.nodeType==='project'||tn?.nodeType==='project') return 200;
      if(sn?.nodeType==='company'||tn?.nodeType==='company') return 130;
      if(sn?.nodeType==='quotation'||tn?.nodeType==='quotation') return 110;
      return 85;
    }).strength(0.35)
  ).alphaDecay(0.025).velocityDecay(0.45)
  .on('tick', ()=>{}); // 渲染在 RAF 中

function rebuildSim(){
  saveCurrentPositions();
  buildGraph();
  // 恢复已有节点位置；已激活的节点用 fx/fy 固定
  let hasPinned = false;
  visNodes.forEach(d=>{
    const saved = savedPositions[d.id];
    if(saved){
      d.x = saved.x; d.y = saved.y;
      if(activated.has(d.id)){
        d.fx = saved.x; d.fy = saved.y;
        hasPinned = true;
      }
    }
  });
  sim.nodes(visNodes);
  sim.force('link').links(visLinks);
  sim.alpha(hasPinned ? 0.3 : 0.5).restart();
}

// ============================================================
// 主渲染循环
// ============================================================
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(camScale, camScale);
  ctx.translate(camX, camY);

  // --- 连线 ---
  // 分两轮画：先画未激活的，再画已激活的（保证已探索路径在上层）
  const linkLayers = [[],[]]; // [0]=底层(未探索), [1]=上层(已探索)
  visLinks.forEach(l=>{
    const s=l.source, t=l.target;
    if(!s.x||!t.x) return;
    const bothAct = activated.has(s.id) && activated.has(t.id);
    linkLayers[bothAct?1:0].push(l);
  });

  linkLayers.forEach((links,layer)=>{
    links.forEach(l=>{
      const s=l.source, t=l.target;
      const sid=s.id, tid=t.id;
      const bothAct = layer===1;
      const oneAct = activated.has(sid) || activated.has(tid);
      const isSel = selectedId && (sid===selectedId || tid===selectedId);
      const isHov = hoveredId && (sid===hoveredId || tid===hoveredId);

      // 涉及非中心项目的连线：始终暗淡
      const sOtherProj = ALL_NODES[sid]?.nodeType==='project' && String(sid)!==String(centerId);
      const tOtherProj = ALL_NODES[tid]?.nodeType==='project' && String(tid)!==String(centerId);
      const touchesOtherProj = sOtherProj || tOtherProj;

      if(isSel && !touchesOtherProj){
        // 当前选中节点的连线 — 最亮白（但不包括连向其他项目的线）
        ctx.save();
        ctx.shadowColor='rgba(200,220,255,0.3)';
        ctx.shadowBlur=8;
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=searchQuery?'rgba(210,225,255,0.08)':'rgba(210,225,255,0.7)';
        ctx.lineWidth=2.5; ctx.stroke();
        ctx.restore();
      } else if(touchesOtherProj && !isHov){
        // 连向非中心项目的线：始终极暗虚线
        ctx.beginPath(); ctx.setLineDash([2,6]);
        ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle='rgba(120,140,180,0.06)';
        ctx.lineWidth=0.4; ctx.stroke(); ctx.setLineDash([]);
      } else if(touchesOtherProj && isHov){
        // hover 到非中心项目时连线才亮
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle='rgba(180,200,240,0.3)';
        ctx.lineWidth=1; ctx.stroke();
      } else if(bothAct){
        // ★ 已探索路径 — 暖金色，粗线+光晕，和冷蓝色未探索形成鲜明对比
        if(!searchQuery){
          // 外层光晕
          ctx.save();
          ctx.shadowColor='rgba(255,200,100,0.25)';
          ctx.shadowBlur=10;
          ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
          ctx.strokeStyle='rgba(255,220,150,0.15)';
          ctx.lineWidth=5; ctx.stroke();
          ctx.restore();
        }
        // 核心线
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=searchQuery?'rgba(255,220,150,0.05)':'rgba(255,220,150,0.55)';
        ctx.lineWidth=1.8; ctx.stroke();
      } else if(isHov){
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=searchQuery?'rgba(180,200,240,0.04)':'rgba(180,200,240,0.35)';
        ctx.lineWidth=1.2; ctx.stroke();
      } else if(oneAct){
        // 一端已探索 — 暗淡冷蓝虚线
        ctx.beginPath(); ctx.setLineDash([4,6]);
        ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=searchQuery?'rgba(140,160,200,0.015)':'rgba(140,160,200,0.1)';
        ctx.lineWidth=0.6; ctx.stroke(); ctx.setLineDash([]);
      } else {
        // 完全未探索 — 极暗点状虚线
        ctx.beginPath(); ctx.setLineDash([1,8]);
        ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y);
        ctx.strokeStyle=searchQuery?'rgba(120,140,180,0.01)':'rgba(120,140,180,0.04)';
        ctx.lineWidth=0.4; ctx.stroke(); ctx.setLineDash([]);
      }

      // 标签（只在已探索路径或选中/hover时显示）
      const showLabel = isSel || bothAct || isHov;
      if(l.label && showLabel && !searchQuery){
        const mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
        const la = isSel?0.6 : bothAct?0.4 : 0.3;
        ctx.font='9px -apple-system,PingFang SC,sans-serif';
        ctx.fillStyle=`rgba(255,255,255,${la})`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(l.label, mx, my-5);
      }
    });
  });

  // --- 节点（从后往前画，选中的最后画在最上层）---
  const sortedNodes = [...visNodes].sort((a,b)=>{
    if(a.id===selectedId) return 1;
    if(b.id===selectedId) return -1;
    if(a.id===hoveredId) return 1;
    if(b.id===hoveredId) return -1;
    return 0;
  });

  sortedNodes.forEach(d=>{
    if(!d.x) return;
    const v = calcVis(d);
    const c = starColor(d);

    // 光晕（shadowBlur 实现）
    ctx.save();
    ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},${v.glowOp})`;
    ctx.shadowBlur=v.glowR;
    ctx.beginPath();
    ctx.arc(d.x, d.y, v.r, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${v.op})`;
    ctx.fill();
    ctx.restore();

    // 十字光芒
    if(v.crossOp > 0.02){
      ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${v.crossOp})`;
      ctx.lineWidth = v.r > 8 ? 1 : 0.5;
      ctx.beginPath();
      ctx.moveTo(d.x-v.crossLen, d.y); ctx.lineTo(d.x+v.crossLen, d.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(d.x, d.y-v.crossLen); ctx.lineTo(d.x, d.y+v.crossLen);
      ctx.stroke();
      // 斜十字（45度，更短更淡，增加星芒感）
      if(v.r > 6){
        const dLen = v.crossLen * 0.5;
        ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${v.crossOp*0.4})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(d.x-dLen, d.y-dLen); ctx.lineTo(d.x+dLen, d.y+dLen);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(d.x+dLen, d.y-dLen); ctx.lineTo(d.x-dLen, d.y+dLen);
        ctx.stroke();
      }
    }

    // 白色核心亮点
    if(v.r > 2){
      const coreR = v.r * 0.35;
      ctx.beginPath();
      ctx.arc(d.x, d.y, coreR, 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${v.op*0.5})`;
      ctx.fill();
    }

    // 未展开指示环
    if(d.hasMore && !isLeaf(d)){
      ctx.beginPath();
      ctx.arc(d.x, d.y, v.r+5, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(200,215,255,${v.op*0.3})`;
      ctx.lineWidth=0.5;
      ctx.setLineDash([2,3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 标签
    if(v.labelOp > 0.02){
      ctx.font=`${v.lw} ${v.ls}px -apple-system,PingFang SC,sans-serif`;
      ctx.fillStyle=`rgba(255,255,255,${v.labelOp})`;
      ctx.textAlign='center'; ctx.textBaseline='top';
      ctx.shadowColor=`rgba(0,0,0,0.8)`; ctx.shadowBlur=4;
      ctx.fillText(d.name, d.x, d.y+v.r+8);
      ctx.shadowBlur=0;
    }

    // 子标签
    if(v.subOp > 0.02){
      const sub = d.nodeType==='project'?d.stage||'':
                  d.nodeType==='company'?d.role||'':
                  d.nodeType==='contact'?d.position||'':
                  d.nodeType==='member'?d.role||'':
                  d.nodeType==='quotation'?(d.status?d.amount+' · '+d.status:d.amount||''):
                  d.nodeType==='workitem'?d.workType||'':
                  d.nodeType==='task'?(d.status||''):
                  d.nodeType==='product'?(d.category||''):
                  d.date||'';
      if(sub){
        ctx.font=`400 9px -apple-system,PingFang SC,sans-serif`;
        ctx.fillStyle=`rgba(255,255,255,${v.subOp})`;
        ctx.textAlign='center'; ctx.textBaseline='top';
        ctx.fillText(sub, d.x, d.y+v.r+22);
      }
    }
  });

  ctx.restore();
}

// 动画循环
function animate(){
  drawBg();
  draw();
  requestAnimationFrame(animate);
}

// ============================================================
// 鼠标交互 — 碰撞检测
// ============================================================
function hitTest(sx,sy){
  const w = screenToWorld(sx,sy);
  let hit = null, minD = Infinity;
  visNodes.forEach(d=>{
    if(!d.x) return;
    const dx=d.x-w.x, dy=d.y-w.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const hitR = Math.max((BASE_R[d.nodeType]||3)*2, 12); // 最小点击区域12px
    if(dist < hitR && dist < minD){ hit=d; minD=dist; }
  });
  return hit;
}

let dragNode=null, isPanning=false, hasDragged=false;
let lastMouse={x:0,y:0}, mouseDownPos=null;
const DRAG_THRESHOLD = 5; // 像素，区分点击和拖拽

mainCanvas.addEventListener('mousemove', e=>{
  const mx=e.clientX, my=e.clientY;

  // 判断是否真的在拖拽（超过阈值才算）
  if(mouseDownPos){
    const dx=mx-mouseDownPos.x, dy=my-mouseDownPos.y;
    if(!hasDragged && dx*dx+dy*dy > DRAG_THRESHOLD*DRAG_THRESHOLD){
      hasDragged = true;
      // 拖拽刚开始，设置 fx/fy
      if(dragNode){
        const w=screenToWorld(mx,my);
        dragNode.fx=w.x; dragNode.fy=w.y;
        sim.alphaTarget(0.3).restart();
      }
    }
  }

  if(hasDragged && dragNode){
    const w=screenToWorld(mx,my);
    dragNode.fx=w.x; dragNode.fy=w.y;
    sim.alphaTarget(0.3).restart();
    return;
  }

  if(hasDragged && isPanning){
    const dx=(mx-lastMouse.x)/camScale, dy=(my-lastMouse.y)/camScale;
    camX+=dx; camY+=dy;
    lastMouse={x:mx,y:my};
    return;
  }

  // hover（没有按下鼠标时）
  const hit=hitTest(mx,my);
  const newHover = hit ? hit.id : null;
  if(newHover !== hoveredId){
    hoveredId = newHover;
    const isClickable = !isLeaf(hit) || isOtherProject(hit); // 其他项目也可点击（弹确认）
    mainCanvas.style.cursor = hit ? (isClickable?'pointer':'default') : 'default';
    if(hit) showTip(e,hit); else hideTip();
  }
  if(hit) moveTip(e);
});

mainCanvas.addEventListener('mousedown', e=>{
  const mx=e.clientX, my=e.clientY;
  mouseDownPos={x:mx,y:my};
  lastMouse={x:mx,y:my};
  hasDragged=false;
  const hit=hitTest(mx,my);

  if(hit && !isLeaf(hit) && !isOtherProject(hit)){
    dragNode=hit;
    // 不立即设置 fx/fy，等超过阈值才设置
  } else {
    isPanning=true;
  }
});

mainCanvas.addEventListener('mouseup', e=>{
  if(hasDragged && dragNode){
    // 真正拖拽过：保存新位置
    if(activated.has(dragNode.id)){
      savedPositions[dragNode.id]={x:dragNode.x, y:dragNode.y};
      dragNode.fx=dragNode.x; dragNode.fy=dragNode.y;
    } else {
      dragNode.fx=null; dragNode.fy=null;
    }
    sim.alphaTarget(0);
  }
  dragNode=null; isPanning=false; mouseDownPos=null;
});

mainCanvas.addEventListener('click', e=>{
  if(hasDragged) return;
  const hit=hitTest(e.clientX,e.clientY);
  if(hit){
    // 其他项目：点击弹确认（不算普通 leaf 逻辑）
    if(isOtherProject(hit)){
      showSwitchConfirm(hit.id);
      return;
    }
    if(isLeaf(hit)) return;
    handleClick(hit.id);
  } else {
    if(selectedId){ selectedId=null; refreshNb(); }
  }
});

mainCanvas.addEventListener('dblclick', e=>{
  if(hasDragged) return;
  const hit=hitTest(e.clientX,e.clientY);
  if(!hit) return;
  // 其他项目双击也走确认
  if(isOtherProject(hit)){
    showSwitchConfirm(hit.id);
    return;
  }
  if(!isLeaf(hit)) switchCenter(hit.id);
});

mainCanvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(0.15, Math.min(5, camScale*zoomFactor));
  // 缩放到鼠标位置
  const wx = (e.clientX-W/2)/camScale - camX;
  const wy = (e.clientY-H/2)/camScale - camY;
  camScale = newScale;
  camX = (e.clientX-W/2)/camScale - wx;
  camY = (e.clientY-H/2)/camScale - wy;
}, {passive:false});

// ============================================================
// 业务逻辑
// ============================================================
let pendingSwitchId = null;

function showSwitchConfirm(id){
  const nd = ALL_NODES[id]; if(!nd) return;
  pendingSwitchId = id;
  document.getElementById('switchTarget').textContent = nd.name;
  document.getElementById('switchOverlay').classList.add('show');
}

function closeSwitchConfirm(){
  pendingSwitchId = null;
  document.getElementById('switchOverlay').classList.remove('show');
}

document.getElementById('switchConfirm').addEventListener('click', ()=>{
  if(pendingSwitchId){
    const id = pendingSwitchId;
    closeSwitchConfirm();
    switchCenter(id);
  }
});
document.getElementById('switchCancel').addEventListener('click', closeSwitchConfirm);
document.getElementById('switchOverlay').addEventListener('click', e=>{
  if(e.target === e.currentTarget) closeSwitchConfirm();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && pendingSwitchId) closeSwitchConfirm();
});

function handleClick(id){
  const nd = ALL_NODES[id];

  // ★ 非中心项目：弹确认框而非展开
  if(nd && nd.nodeType === 'project' && String(id) !== String(centerId)){
    showSwitchConfirm(id);
    return;
  }

  // ★ 核心：只激活被点击的节点本身，邻居不自动激活
  activated.add(id);

  if(selectedId===id){
    if(expanded.has(id)){
      expanded.delete(id);
      getNeighbors(id).forEach(nid=>{if(nid!==centerId)expanded.delete(nid);});
    } else { expanded.add(id); }
    selectedId=null; refreshNb(); rebuildSim();
  } else {
    selectedId=id;
    if(!expanded.has(id)) expanded.add(id);
    refreshNb(); updateInfo(id); rebuildSim();
  }
}

function switchCenter(id){
  const nd=ALL_NODES[id]; if(!nd) return;
  // 切换项目中心 → 完全重置状态
  activated.clear();
  activated.add(id);
  Object.keys(savedPositions).forEach(k=>delete savedPositions[k]);
  centerId=id; selectedId=null;
  expanded.clear(); expanded.add(id);
  refreshNb();
  navHistory.push({id,name:nd.name});
  updateBreadcrumb(); updateInfo(id); rebuildSim();
  // 缓动回中心
  const startX=camX, startY=camY;
  const dur=600, t0=Date.now();
  function ease(){
    const p=Math.min(1,(Date.now()-t0)/dur);
    const ep=1-Math.pow(1-p,3); // easeOutCubic
    camX=startX*(1-ep); camY=startY*(1-ep);
    if(p<1) requestAnimationFrame(ease);
  }
  ease();
}

function updateInfo(id){
  const nd=ALL_NODES[id]; if(!nd) return;
  document.getElementById('infoTitle').textContent=nd.name;
  let m='';
  if(nd.nodeType==='project') m=`阶段: <b>${nd.stage}</b> &nbsp; 金额: <b>${nd.amount}</b>`;
  else if(nd.nodeType==='company') m=`角色: <b>${nd.role}</b>`;
  else if(nd.nodeType==='contact'){const co=ALL_NODES[nd.pc];m=`职位: <b>${nd.position}</b> &nbsp; 企业: <b>${co?.name||''}</b>`;}
  else if(nd.nodeType==='member') m=`角色: <b>${nd.role}</b> &nbsp; 部门: <b>${nd.dept}</b>`;
  else if(nd.nodeType==='quotation') m=`金额: <b>${nd.amount}</b> &nbsp; 状态: <b>${nd.status}</b> &nbsp; ${nd.detail||''}`;
  else if(nd.nodeType==='workitem') m=`类型: <b>${nd.workType}</b> &nbsp; 日期: <b>${nd.date||''}</b> &nbsp; ${nd.detail||''}`;
  else if(nd.nodeType==='task') m=`状态: <b>${nd.status}</b> &nbsp; 指派: <b>${nd.assignee||''}</b> &nbsp; 截止: <b>${nd.dueDate||''}</b>`;
  else if(nd.nodeType==='product') m=`品类: <b>${nd.category||''}</b> &nbsp; 品牌: <b>${nd.brand||''}</b>`;
  else m=`日期: <b>${nd.date||''}</b> &nbsp; <b>${nd.detail||''}</b>`;
  document.getElementById('infoMeta').innerHTML=m;
}

function updateBreadcrumb(){
  const el=document.getElementById('breadcrumb');
  el.innerHTML=navHistory.map((h,i)=>{
    const cls=i===navHistory.length-1?'bc-item active':'bc-item';
    const sep=i<navHistory.length-1?'<span class="bc-sep">›</span>':'';
    return `<span class="${cls}" data-id="${h.id}">${h.name}</span>${sep}`;
  }).join('');
  el.querySelectorAll('.bc-item:not(.active)').forEach(e=>{
    e.addEventListener('click',()=>{
      const tid=e.dataset.id, idx=navHistory.findIndex(h=>h.id===tid);
      if(idx>=0){
        navHistory=navHistory.slice(0,idx+1);
        centerId=tid; selectedId=null;
        expanded.clear(); expanded.add(tid);
        refreshNb(); updateBreadcrumb(); updateInfo(tid); rebuildSim();
      }
    });
  });
}

// Tooltip
const tip=document.getElementById('tooltip');
function showTip(ev,d){
  tip.querySelector('.t-name').textContent=d.name;
  const types={project:'项目',company:'企业',contact:'联系人',member:'内部成员',quotation:'报价单',workitem:'工作活动',task:'任务',product:'产品'};
  tip.querySelector('.t-type').textContent=types[d.nodeType]||'';
  let dt='';
  if(d.nodeType==='project') dt=`${d.stage} · ${d.amount}`;
  else if(d.nodeType==='company') dt=d.role;
  else if(d.nodeType==='contact') dt=`${d.position} · ${ALL_NODES[d.pc]?.name||''}`;
  else if(d.nodeType==='member') dt=`${d.role} · ${d.dept}`;
  else if(d.nodeType==='quotation') dt=`${d.amount} · ${d.status}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='workitem') dt=`${d.workType} · ${d.date}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='task') dt=`${d.status} · 指派: ${d.assignee||''}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='product') dt=`${d.category||''} · ${d.brand||''}`;
  else dt=d.detail||'';
  if(isOtherProject(d)) dt+='<br><span style="color:rgba(255,220,150,0.4)">点击切换为中心项目</span>';
  else if(d.hasMore&&!isLeaf(d)) dt+='<br><span style="color:rgba(255,255,255,0.25)">点击展开更多</span>';
  tip.querySelector('.t-detail').innerHTML=dt;
  tip.classList.add('show'); moveTip(ev);
}
function moveTip(ev){tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY-8)+'px';}
function hideTip(){tip.classList.remove('show');}

document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value.toLowerCase().trim();
});

window.addEventListener('resize',()=>{
  resizeCanvases();
  sim.alpha(0.3).restart();
});

// ============================================================
// 启动
// ============================================================
rebuildSim();
animate();
</script>
</body>
</html>
