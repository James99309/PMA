<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  overflow: hidden; height: 100vh; width: 100vw;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  cursor: default; background: #080b18;
}
canvas#nebula { position: fixed; top: 0; left: 0; z-index: 0; }
svg#graph { position: fixed; top: 0; left: 0; z-index: 1; }
.panel {
  position: fixed; z-index: 10;
  background: rgba(10, 14, 30, 0.7); backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; color: #dde4f0;
}
.info-panel { top: 24px; left: 24px; padding: 18px 22px; min-width: 260px; }
.info-panel .label {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); margin-bottom: 10px;
}
.info-panel .title { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: #fff; }
.info-panel .meta { font-size: 12px; color: rgba(255,255,255,0.4); line-height: 1.7; }
.info-panel .meta b { color: rgba(255,255,255,0.7); font-weight: 500; }
.breadcrumb {
  top: 24px; left: 50%; transform: translateX(-50%);
  padding: 7px 18px; display: flex; align-items: center; gap: 6px; font-size: 12px;
}
.bc-item { color: rgba(255,255,255,0.35); cursor: pointer; transition: color .2s; }
.bc-item:hover { color: rgba(255,255,255,0.8); }
.bc-item.active { color: #fff; cursor: default; }
.bc-sep { color: rgba(255,255,255,0.15); font-size: 9px; }
.legend-panel { bottom: 24px; left: 24px; padding: 14px 18px; font-size: 11px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: rgba(255,255,255,0.45); }
.legend-row:last-child { margin-bottom: 0; }
.legend-star { width: 8px; height: 8px; border-radius: 50%; }
.lg { width: 12px; height: 12px; }
.lm { width: 9px; height: 9px; }
.ls { width: 6px; height: 6px; }
.hint-panel {
  bottom: 24px; right: 24px; padding: 12px 16px;
  font-size: 11px; color: rgba(255,255,255,0.3); line-height: 1.8;
}
.hint-panel kbd {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 3px; padding: 1px 5px; font-family: inherit; font-size: 10px;
}
.tooltip {
  position: fixed; z-index: 20;
  background: rgba(10,14,30,0.88); backdrop-filter: blur(16px);

.tooltip .t-type { font-size: 10px; color: rgba(255,255,255,0.35); margin-bottom: 6px; }
.tooltip .t-detail { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.5; }
.search-box { position: fixed; top: 24px; right: 24px; z-index: 10; }
.search-box input {
  background: rgba(10,14,30,0.7); backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
  padding: 8px 16px 8px 36px; color: #fff; font-size: 12px;

}
.search-box input:focus { border-color: rgba(255,255,255,0.2); width: 260px; }
.search-box input::placeholder { color: rgba(255,255,255,0.25); }
.search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.35; }

/* ★ 确认对话框 — 匹配星空风格 */
.confirm-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;

}
.confirm-overlay.show { display: flex; }
.confirm-dialog {

.confirm-dialog .cd-sub {

.confirm-dialog .cd-btns { display: flex; gap: 12px; justify-content: center; }
.confirm-dialog .cd-btn {

.confirm-dialog .cd-btn:hover {

}

<script>
// ============================================================
// 星空背景
// ============================================================
const W = window.innerWidth, H = window.innerHeight;
const nebulaCanvas = document.getElementById('nebula');
nebulaCanvas.width = W; nebulaCanvas.height = H;
const nctx = nebulaCanvas.getContext('2d');

function paintNebula() {
  nctx.fillStyle = '#080b18'; nctx.fillRect(0,0,W,H);
  [
    { x:W*0.15,y:H*0.3,r:W*0.45,c:['rgba(80,40,120,0.18)','rgba(40,20,80,0.06)','transparent'] },
    { x:W*0.7,y:H*0.25,r:W*0.5,c:['rgba(30,50,130,0.2)','rgba(20,30,90,0.08)','transparent'] },
    { x:W*0.5,y:H*0.7,r:W*0.4,c:['rgba(60,30,100,0.12)','rgba(30,20,70,0.04)','transparent'] },
    { x:W*0.85,y:H*0.65,r:W*0.35,c:['rgba(40,50,140,0.15)','rgba(25,30,100,0.05)','transparent'] },
    { x:W*0.3,y:H*0.8,r:W*0.3,c:['rgba(90,40,110,0.1)','rgba(50,25,75,0.03)','transparent'] },
  ].forEach(n => {
    const g = nctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c[0]); g.addColorStop(0.5,n.c[1]); g.addColorStop(1,n.c[2]);
    nctx.fillStyle = g; nctx.fillRect(0,0,W,H);
  });
  nctx.save(); nctx.translate(W*0.1,H*0.9); nctx.rotate(-0.6);
  const mg = nctx.createLinearGradient(0,-80,0,80);
  mg.addColorStop(0,'transparent'); mg.addColorStop(0.3,'rgba(120,100,160,0.06)');
  mg.addColorStop(0.5,'rgba(140,120,180,0.09)'); mg.addColorStop(0.7,'rgba(120,100,160,0.06)');
  mg.addColorStop(1,'transparent');
  nctx.fillStyle = mg; nctx.fillRect(-100,-120,W*1.6,240); nctx.restore();
}
const bgStars = Array.from({length:500},()=>({
  x:Math.random()*W, y:Math.random()*H,
  r:Math.random()<0.92?Math.random()*0.8+0.2:Math.random()*1.5+0.8,
  base:Math.random()*0.4+0.15, speed:Math.random()*0.015+0.003,
  phase:Math.random()*Math.PI*2, hasCross:Math.random()<0.04,
}));
function animateBg() {
  nctx.clearRect(0,0,W,H); paintNebula();
  const t = Date.now()/1000;
  bgStars.forEach(s=>{
    const f=Math.sin(t*s.speed*8+s.phase)*0.25+0.75, a=s.base*f;
    nctx.beginPath(); nctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    nctx.fillStyle=`rgba(200,210,255,${a})`; nctx.fill();
    if(s.hasCross){
      const len=s.r*6*f;
      nctx.strokeStyle=`rgba(210,220,255,${a*0.3})`; nctx.lineWidth=0.5;
      nctx.beginPath(); nctx.moveTo(s.x-len,s.y); nctx.lineTo(s.x+len,s.y);
      nctx.moveTo(s.x,s.y-len); nctx.lineTo(s.x,s.y+len); nctx.stroke();
    }
  });
  requestAnimationFrame(animateBg);
}
animateBg();

// ============================================================
// 数据 — 星点大小：项目>企业>人

const ALL_NODES = {}, ALL_LINKS = [];

function link(s,t,label){ ALL_LINKS.push({source:s,target:t,label:label||''}); }

// --- 产品（可选，通过报价关联）---

const expanded = new Set(['p1']);

// ★ 已激活集 — 只有被点击过的节点才加入
const activated = new Set(['p1']);

// ★ 位置记忆 — 防止 render 时已探索节点跳动
const savedPositions = {};

let selectedNeighbors = new Set();

function getNeighbors(nodeId) {
  const ids = new Set();
  ALL_LINKS.forEach(l => {
    const s = typeof l.source==='object'?l.source.id:l.source;
    const t = typeof l.target==='object'?l.target.id:l.target;
    if (s===nodeId) ids.add(t);
    if (t===nodeId) ids.add(s);
  });
  return ids;
}

function refreshSelectedNeighbors() {
  selectedNeighbors = selectedId ? getNeighbors(selectedId) : new Set();
}

// ★ 判断节点是否为非中心项目
function isOtherProject(d) {
  return d.nodeType === 'project' && d.id !== centerId;
}

// 判断一条连线是否连向非中心项目
function linkTouchesOtherProject(d) {
  const s = typeof d.source==='object'?d.source.id:d.source;
  const t = typeof d.target==='object'?d.target.id:d.target;
  const sn = ALL_NODES[s], tn = ALL_NODES[t];
  return (sn?.nodeType==='project' && s!==centerId) || (tn?.nodeType==='project' && t!==centerId);
}

// 判断一条连线两端是否都被激活过
function isLinkActivated(d) {
  const s = typeof d.source==='object'?d.source.id:d.source;
  const t = typeof d.target==='object'?d.target.id:d.target;
  return activated.has(s) && activated.has(t);
}

// ============================================================
// 构建可见图
// ============================================================
function buildGraph() {
  const vis = new Set();
  const visLinks = [];
  vis.add(centerId);
  expanded.forEach(nid => {
    vis.add(nid);
    ALL_LINKS.forEach(l => {
      const s = typeof l.source==='object'?l.source.id:l.source;
      const t = typeof l.target==='object'?l.target.id:l.target;
      if (s===nid) { vis.add(t); visLinks.push({source:s,target:t,label:l.label}); }
      if (t===nid) { vis.add(s); visLinks.push({source:s,target:t,label:l.label}); }
    });
  });
  const seen = new Set();
  const uLinks = visLinks.filter(l => {
    const k=[l.source,l.target].sort().join('|');
    if(seen.has(k)) return false; seen.add(k); return true;
  });
  const nodes = [...vis].map(id=>ALL_NODES[id]).filter(Boolean).map(n=>({
    ...n,
    isCenter: n.id===centerId,
    hasMore: ALL_LINKS.some(l=>{
      const s=typeof l.source==='object'?l.source.id:l.source;
      const t=typeof l.target==='object'?l.target.id:l.target;
      const other = s===n.id?t:(t===n.id?s:null);
      return other && !vis.has(other);
    }),
  }));
  return { nodes, links: uLinks };
}

// ============================================================
// 视觉状态计算
// ★ 改动: 1) otherProj 优先分支  2) 删除 isNb 分支  3) 暗淡默认值
// ============================================================
function isLeafNode(d) {
  if (d.nodeType === 'workitem' || d.nodeType === 'task' || d.nodeType === 'product') return true;
  return !d.hasMore;
}

function calcState(d) {
  const isSel    = d.id === selectedId;
  const isAct    = activated.has(d.id);
  const isHov    = d.id === hoveredId;
  const isCtr    = d.isCenter;
  const isOtherP = isOtherProject(d);
  const base     = BASE_R[d.nodeType] || 3;
  const leaf     = isLeafNode(d);

  let r, opacity, labelOp, subOp, crossScale, crossOp, filter, labelWeight, labelSize;

  // ★ 优先级 1: 非中心项目 — 始终暗淡
  if (isOtherP && !isSel && !isHov) {
    r = base * 0.25;
    opacity = 0.12; labelOp = 0.12; subOp = 0;
    crossScale = 0.8; crossOp = 0.02;
    filter = 'url(#starGlow)';
    labelWeight = 400; labelSize = 9;
  } else if (isOtherP && isHov) {
    // hover 时亮起，提示可切换
    r = base * 0.7;
    opacity = 0.65; labelOp = 0.7; subOp = 0.3;
    crossScale = 2; crossOp = 0.15;
    filter = 'url(#starGlowMid)';
    labelWeight = 600; labelSize = 11;
  } else if (isSel && !leaf) {
    // ★ 选中（有子项可展开）：明显放大
    r = base * 2.2;
    opacity = 1; labelOp = 1; subOp = 0.6;
    crossScale = 4.5; crossOp = 0.5;
    filter = 'url(#starGlowBig)';
    labelWeight = 700; labelSize = 13;
  } else if (isSel && leaf) {
    // ★ 末级选中：不放大，只高亮
    r = base;
    opacity = 1; labelOp = 1; subOp = 0.6;
    crossScale = 3; crossOp = 0.4;
    filter = 'url(#starGlowMid)';
    labelWeight = 700; labelSize = 12;
  } else if (isAct) {
    // ★ 曾点击过：保持亮度，大小 = 基础的 0.8
    r = base * 0.8;
    opacity = 0.82; labelOp = 0.65; subOp = 0.25;
    crossScale = 2; crossOp = 0.15;
    filter = 'url(#starGlowMid)';
    labelWeight = 500; labelSize = 10;
  } else if (isCtr && !selectedId) {
    // ★ 无选中时的中心节点
    r = base * 1.5;
    opacity = 0.95; labelOp = 0.85; subOp = 0.4;
    crossScale = 3.5; crossOp = 0.3;
    filter = 'url(#starGlowBig)';
    labelWeight = 600; labelSize = 12;
  } else {
    // ★ 未激活普通节点：暗淡
    r = base * 0.5;
    opacity = 0.4; labelOp = 0.25; subOp = 0;
    crossScale = 1; crossOp = 0.04;
    filter = 'url(#starGlow)';
    labelWeight = 400; labelSize = 9;
  }

  // Hover 叠加 — 非 otherProject 的普通 hover（otherProject 已在上方处理）
  if (isHov && !isSel && !isOtherP) {
    r = Math.max(r * 1.4, base * 1.1);
    opacity = Math.min(opacity + 0.2, 1);
    labelOp = Math.min(labelOp + 0.35, 1);
    subOp = Math.max(subOp, 0.45);
    crossScale *= 1.3;
    crossOp = Math.min(crossOp + 0.18, 0.45);
    filter = 'url(#starGlowMid)';
    labelWeight = Math.max(labelWeight, 600);
    labelSize = Math.max(labelSize, 11);
  }

  return { r, opacity, labelOp, subOp, crossScale, crossOp, filter, labelWeight, labelSize };
}

function starColor(d) {
  if (d.nodeType==='member') return '#ffe8c0';     // 暖黄色
  if (d.nodeType==='quotation') return '#ffdca0';   // 淡金色
  if (d.nodeType==='workitem') return '#b0c8e8';    // 淡蓝灰色
  if (d.nodeType==='task') return '#b4e6c8';        // 淡绿色
  if (d.nodeType==='product') return '#c8b4e6';     // 淡紫色
  if (d.nodeType==='contact') return '#b4d2f5';     // 浅蓝色
  return '#d8e4ff'; // project, company
}

// ============================================================
// SVG
// ============================================================
const svg = d3.select('#graph').attr('width',W).attr('height',H);
const defs = svg.append('defs');

function makeGlow(id, blurs) {
  const f = defs.append('filter').attr('id',id)
    .attr('x','-300%').attr('y','-300%').attr('width','700%').attr('height','700%');
  blurs.forEach((b,i)=>f.append('feGaussianBlur').attr('in','SourceGraphic').attr('stdDeviation',b).attr('result','b'+i));
  const m = f.append('feMerge');
  blurs.forEach((_,i)=>m.append('feMergeNode').attr('in','b'+i));
  m.append('feMergeNode').attr('in','SourceGraphic');
}
makeGlow('starGlow',[3,6]);
makeGlow('starGlowMid',[4,10,16]);
makeGlow('starGlowBig',[6,14,24]);

const zoomG = svg.append('g');
const zoomBehavior = d3.zoom().scaleExtent([0.15,5])
  .on('zoom',e=>zoomG.attr('transform',e.transform));
svg.call(zoomBehavior);
svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(W/2,H/2));

const linkLayer = zoomG.append('g');
const nodeLayer = zoomG.append('g');

let sim = d3.forceSimulation()
  .force('charge', d3.forceManyBody().strength(d=>d.isCenter?-600:-250))
  .force('center', d3.forceCenter(0,0).strength(0.04))
  .force('collision', d3.forceCollide().radius(d=>(BASE_R[d.nodeType]||3)*4+35))
  .force('link', d3.forceLink().id(d=>d.id)
    .distance(d=>{
      const sn=ALL_NODES[typeof d.source==='object'?d.source.id:d.source];
      const tn=ALL_NODES[typeof d.target==='object'?d.target.id:d.target];
      if(sn?.nodeType==='project'||tn?.nodeType==='project') return 200;
      if(sn?.nodeType==='company'||tn?.nodeType==='company') return 130;
      if(sn?.nodeType==='quotation'||tn?.nodeType==='quotation') return 110;
      return 85;
    }).strength(0.35)
  ).alphaDecay(0.025).velocityDecay(0.45);

// 持久引用
// ============================================================
let linkAll, lblAll, nodeAll;

// ============================================================
// 确认对话框逻辑
// ============================================================
let pendingSwitchId = null;
const confirmOverlay = document.getElementById('confirmOverlay');
const confirmTitle = document.getElementById('confirmTitle');
const confirmSub = document.getElementById('confirmSub');

function showConfirmSwitch(id) {
  const nd = ALL_NODES[id];
  if (!nd) return;
  pendingSwitchId = id;
  confirmTitle.textContent = `切换到「${nd.name}」？`;
  confirmSub.textContent = `将以此项目为中心重新展开星图，当前探索进度会重置`;
  confirmOverlay.classList.add('show');
}

document.getElementById('confirmCancel').addEventListener('click', () => {
  confirmOverlay.classList.remove('show');
  pendingSwitchId = null;
});

document.getElementById('confirmOk').addEventListener('click', () => {
  confirmOverlay.classList.remove('show');
  if (pendingSwitchId) {
    switchCenter(pendingSwitchId);
    pendingSwitchId = null;
  }
});

// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && confirmOverlay.classList.contains('show')) {
    confirmOverlay.classList.remove('show');
    pendingSwitchId = null;
  }
});

// ============================================================
// 全量渲染 — ★ 位置保存/恢复
// ============================================================
function render() {
  // ★ 保存当前所有节点位置
  if (nodeAll) {
    nodeAll.each(d => {
      if (d.x != null && d.y != null) {
        savedPositions[d.id] = { x: d.x, y: d.y };
      }
    });
  }

  const graph = buildGraph();

  // ★ 恢复已保存的位置
  graph.nodes.forEach(n => {
    if (savedPositions[n.id]) {
      n.x = savedPositions[n.id].x;
      n.y = savedPositions[n.id].y;
      // 已激活节点固定位置（pinned）
      if (activated.has(n.id)) {
        n.fx = n.x;
        n.fy = n.y;
      }
    }
  });

  // Links
  const linkSel = linkLayer.selectAll('.cline')
    .data(graph.links, d=>`${typeof d.source==='object'?d.source.id:d.source}-${typeof d.target==='object'?d.target.id:d.target}`);
  linkSel.exit().transition().duration(400).attr('opacity',0).remove();
  const linkEnter = linkSel.enter().append('line')
    .attr('class','cline').attr('stroke-linecap','round').attr('opacity',0);
  linkAll = linkEnter.merge(linkSel);

  // Link labels
  const lblData = graph.links.filter(d=>d.label);
  const lblSel = linkLayer.selectAll('.clbl').data(lblData,
    d=>`${typeof d.source==='object'?d.source.id:d.source}-${typeof d.target==='object'?d.target.id:d.target}-l`);
  lblSel.exit().remove();
  const lblEnter = lblSel.enter().append('text')
    .attr('class','clbl').attr('font-size',9).attr('text-anchor','middle').attr('pointer-events','none');
  lblAll = lblEnter.merge(lblSel);
  lblAll.text(d=>d.label);

  // Nodes
  const nodeSel = nodeLayer.selectAll('.snode').data(graph.nodes, d=>d.id);
  nodeSel.exit().transition().duration(400).attr('opacity',0).remove();

  const nodeEnter = nodeSel.enter().append('g')
    .attr('class','snode').attr('opacity',0)
    .call(d3.drag()
      .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{
        if(!e.active)sim.alphaTarget(0);
        // ★ 已激活节点拖拽结束后保持 pinned 并保存位置
        if (activated.has(d.id)) {
          d.fx = d.x; d.fy = d.y;
          savedPositions[d.id] = { x: d.x, y: d.y };
        } else {
          d.fx=null;d.fy=null;
        }
      })
    );

  nodeEnter.append('circle').attr('class','halo');
  nodeEnter.append('line').attr('class','crH');
  nodeEnter.append('line').attr('class','crV');
  nodeEnter.append('circle').attr('class','core');
  nodeEnter.append('text').attr('class','slbl').attr('text-anchor','middle').attr('pointer-events','none');
  nodeEnter.append('text').attr('class','ssub').attr('text-anchor','middle').attr('pointer-events','none');
  nodeEnter.append('circle').attr('class','ring');

  nodeAll = nodeEnter.merge(nodeSel);
  nodeAll.transition().duration(500).attr('opacity',1);

  // ★ 非中心项目和非末级节点都用 pointer
  nodeAll.style('cursor', d => {
    if (isOtherProject(d)) return 'pointer';
    return isLeafNode(d) ? 'default' : 'pointer';
  });

  nodeAll
    .on('click', (ev,d)=>{ev.stopPropagation(); handleClick(d.id);})
    .on('dblclick', (ev,d)=>{
      ev.stopPropagation();
      // ★ 非中心项目：走确认框
      if (isOtherProject(d)) { showConfirmSwitch(d.id); return; }
      if(!isLeafNode(d)) switchCenter(d.id);
    })
    .on('mouseenter', (ev,d)=>{hoveredId=d.id; updateVisuals(); showTip(ev,d);})
    .on('mousemove', (ev)=>moveTip(ev))
    .on('mouseleave', ()=>{hoveredId=null; updateVisuals(); hideTip();});

  sim.nodes(graph.nodes);
  sim.force('link').links(graph.links);
  sim.alpha(0.5).restart();

  sim.on('tick',()=>{
    linkAll.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
           .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    lblAll.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
    nodeAll.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

  updateVisuals();
}

// ============================================================
// 视觉更新（快速，不重建结构）
// ★ 改动: 连线区分已探索/未探索/连向其他项目
// ============================================================
function updateVisuals() {
  if(!nodeAll||!linkAll) return;
  const dur = 250;

  // 节点
  nodeAll.each(function(d) {
    const g = d3.select(this);
    const st = calcState(d);
    const color = starColor(d);
    const cLen = st.r * st.crossScale;

    g.select('.halo').transition().duration(dur)
      .attr('r', st.r*3).attr('fill',color)
      .attr('opacity', st.opacity*0.12).attr('filter', st.filter);

    g.select('.crH').transition().duration(dur)
      .attr('x1',-cLen).attr('x2',cLen).attr('y1',0).attr('y2',0)
      .attr('stroke',color).attr('stroke-width', st.r>8?1:0.5)
      .attr('opacity', st.crossOp);

    g.select('.crV').transition().duration(dur)
      .attr('x1',0).attr('x2',0).attr('y1',-cLen).attr('y2',cLen)
      .attr('stroke',color).attr('stroke-width', st.r>8?1:0.5)
      .attr('opacity', st.crossOp);

    g.select('.core').transition().duration(dur)
      .attr('r', st.r).attr('fill','#fff')
      .attr('opacity', st.opacity).attr('filter', st.filter);

    g.select('.slbl').text(d.name)
      .transition().duration(dur)
      .attr('dy', st.r+14)
      .attr('font-size', st.labelSize)
      .attr('font-weight', st.labelWeight)
      .attr('fill', `rgba(255,255,255,${st.labelOp})`);

    const sub = st.subOp > 0 ? (
      d.nodeType==='project'?d.stage||'':
      d.nodeType==='company'?d.role||'':
      d.nodeType==='contact'?d.position||'':
      d.nodeType==='member'?d.role||'':
      d.nodeType==='quotation'?(d.status?d.amount+' · '+d.status:d.amount||''):
      d.nodeType==='workitem'?d.workType||'':
      d.nodeType==='task'?(d.status||''):
      d.nodeType==='product'?(d.category||''):
      d.date||''
    ) : '';
    g.select('.ssub').text(sub)
      .transition().duration(dur)
      .attr('dy', st.r+27).attr('font-size',9)
      .attr('fill', `rgba(255,255,255,${st.subOp})`);

    g.select('.ring').transition().duration(dur)
      .attr('r', st.r+5).attr('fill','none')
      .attr('stroke', d.hasMore?`rgba(200,215,255,${st.opacity*0.35})`:'none')
      .attr('stroke-width',0.5)
      .attr('stroke-dasharray', d.hasMore?'2,3':'none');
  });

  // ★ 连线 — 区分：已探索路径(暖金色) / 连向其他项目(极暗虚线) / 选中直连 / 未探索
  linkAll.transition().duration(dur)
    .attr('stroke', d => {
      const s=typeof d.source==='object'?d.source.id:d.source;
      const t=typeof d.target==='object'?d.target.id:d.target;
      const touchesOtherP = linkTouchesOtherProject(d);

      // 连向非中心项目的线：极暗
      if (touchesOtherP) {
        // hover 时稍亮
        if (hoveredId && (s===hoveredId||t===hoveredId)) return 'rgba(160,180,220,0.2)';
        return 'rgba(120,140,180,0.04)';
      }
      // 选中节点的直连线（不含连向其他项目的）
      if (selectedId && (s===selectedId||t===selectedId)) return 'rgba(200,215,255,0.5)';
      // hover 节点的直连线
      if (hoveredId && (s===hoveredId||t===hoveredId)) return 'rgba(200,215,255,0.35)';
      // ★ 已探索路径（两端都被激活过）：暖金色
      if (activated.has(s) && activated.has(t)) return 'rgba(255,220,150,0.55)';
      // 至少一端激活
      if (activated.has(s) || activated.has(t)) return 'rgba(160,180,220,0.1)';
      // 默认：更暗的虚线色
      return 'rgba(120,140,180,0.04)';
    })
    .attr('stroke-width', d => {
      const s=typeof d.source==='object'?d.source.id:d.source;
      const t=typeof d.target==='object'?d.target.id:d.target;
      const touchesOtherP = linkTouchesOtherProject(d);

      if (touchesOtherP) return 0.5;
      if (selectedId && (s===selectedId||t===selectedId)) return 1.5;
      if (hoveredId && (s===hoveredId||t===hoveredId)) return 1.2;
      // ★ 已探索路径：更粗
      if (activated.has(s) && activated.has(t)) return 1.8;
      return 0.5;
    })
    .attr('stroke-dasharray', d => {
      const s=typeof d.source==='object'?d.source.id:d.source;
      const t=typeof d.target==='object'?d.target.id:d.target;
      const touchesOtherP = linkTouchesOtherProject(d);

      // 连向其他项目：虚线
      if (touchesOtherP) return '3,5';
      // 已探索路径：实线
      if (activated.has(s) && activated.has(t)) return 'none';
      // 选中/hover 的直连线：实线
      if (selectedId && (s===selectedId||t===selectedId)) return 'none';
      if (hoveredId && (s===hoveredId||t===hoveredId)) return 'none';
      // 未探索：虚线
      return '2,4';
    })
    .attr('opacity',1);

  // 连线标签
  lblAll.transition().duration(dur)
    .attr('fill', d => {
      const s=typeof d.source==='object'?d.source.id:d.source;
      const t=typeof d.target==='object'?d.target.id:d.target;
      if (linkTouchesOtherProject(d)) return 'rgba(255,255,255,0.06)';
      if (selectedId && (s===selectedId||t===selectedId)) return 'rgba(255,255,255,0.55)';
      if (hoveredId && (s===hoveredId||t===hoveredId)) return 'rgba(255,255,255,0.45)';
      if (activated.has(s) && activated.has(t)) return 'rgba(255,220,150,0.5)';
      return 'rgba(255,255,255,0.08)';
    });
}

// ============================================================
// 交互
// ★ 改动: 1) 只激活被点击的节点  2) 拦截非中心项目 → 弹确认
// ============================================================
function handleClick(id) {
  const nd = ALL_NODES[id];
  const nodeData = nodeAll ? nodeAll.data().find(n => n.id === id) : null;

  // ★ 非中心项目：弹确认框
  if (nd && nd.nodeType === 'project' && id !== centerId) {
    showConfirmSwitch(id);
    return;
  }

  // ★ 末级节点：点击无效
  if (nd && nodeData && isLeafNode(nodeData)) return;

  // ★ 只激活被点击的节点（不自动激活邻居）
  activated.add(id);

  if (selectedId === id) {
    // 再次点击：切换展开/收起
    if (expanded.has(id)) {
      expanded.delete(id);
      getNeighbors(id).forEach(nid => { if(nid!==centerId) expanded.delete(nid); });
    } else {
      expanded.add(id);
    }
    selectedId = null;
    refreshSelectedNeighbors();
    render();
  } else {
    selectedId = id;
    if (!expanded.has(id)) expanded.add(id);
    refreshSelectedNeighbors();
    updateInfo(id);
    render();
  }
}

svg.on('click', ()=>{
  if(selectedId){ selectedId=null; refreshSelectedNeighbors(); updateVisuals(); }
});

// ★ switchCenter 重置状态
function switchCenter(id) {
  const nd=ALL_NODES[id]; if(!nd) return;
  centerId=id; selectedId=null;
  // ★ 清空已激活集和位置记忆，全新开始
  activated.clear(); activated.add(id);
  Object.keys(savedPositions).forEach(k => delete savedPositions[k]);
  expanded.clear(); expanded.add(id);
  refreshSelectedNeighbors();
  navHistory.push({id,name:nd.name});
  updateBreadcrumb(); updateInfo(id); render();
  svg.transition().duration(800).call(zoomBehavior.transform, d3.zoomIdentity.translate(W/2,H/2));
}

function updateInfo(id) {
  const nd=ALL_NODES[id]; if(!nd) return;
  document.getElementById('infoTitle').textContent = nd.name;
  let m='';
  if(nd.nodeType==='project') m=`阶段: <b>${nd.stage}</b> &nbsp; 金额: <b>${nd.amount}</b>`;
  else if(nd.nodeType==='company') m=`角色: <b>${nd.role}</b>`;
  else if(nd.nodeType==='contact'){ const co=ALL_NODES[nd.parentCompany]; m=`职位: <b>${nd.position}</b> &nbsp; 企业: <b>${co?.name||''}</b>`; }
  else if(nd.nodeType==='member') m=`角色: <b>${nd.role}</b> &nbsp; 部门: <b>${nd.dept}</b>`;
  else if(nd.nodeType==='quotation') m=`金额: <b>${nd.amount}</b> &nbsp; 状态: <b>${nd.status}</b> &nbsp; ${nd.detail||''}`;
  else if(nd.nodeType==='workitem') m=`类型: <b>${nd.workType}</b> &nbsp; 日期: <b>${nd.date||''}</b> &nbsp; ${nd.detail||''}`;
  else if(nd.nodeType==='task') m=`状态: <b>${nd.status}</b> &nbsp; 指派: <b>${nd.assignee||''}</b> &nbsp; 截止: <b>${nd.dueDate||''}</b>`;
  else if(nd.nodeType==='product') m=`品类: <b>${nd.category||''}</b> &nbsp; 品牌: <b>${nd.brand||''}</b>`;
  else m=`日期: <b>${nd.date||''}</b> &nbsp; <b>${nd.detail||''}</b>`;
  document.getElementById('infoMeta').innerHTML = m;
}

function updateBreadcrumb() {
  const el=document.getElementById('breadcrumb');
  el.innerHTML = navHistory.map((h,i)=>{
    const cls = i===navHistory.length-1?'bc-item active':'bc-item';
    const sep = i<navHistory.length-1?'<span class="bc-sep">›</span>':'';
    return `<span class="${cls}" data-id="${h.id}">${h.name}</span>${sep}`;
  }).join('');
  el.querySelectorAll('.bc-item:not(.active)').forEach(e=>{
    e.addEventListener('click',()=>{
      const tid=e.dataset.id;
      const idx=navHistory.findIndex(h=>h.id===tid);
      if(idx>=0){
        navHistory=navHistory.slice(0,idx+1);
        centerId=tid; selectedId=null;
        activated.clear(); activated.add(tid);
        Object.keys(savedPositions).forEach(k => delete savedPositions[k]);
        expanded.clear(); expanded.add(tid);
        refreshSelectedNeighbors();
        updateBreadcrumb(); updateInfo(tid); render();
      }
    });
  });
}

// ★ Tooltip — 非中心项目显示"点击切换"
const tip = document.getElementById('tooltip');
function showTip(ev,d) {
  tip.querySelector('.t-name').textContent = d.name;
  const types={project:'项目',company:'企业',contact:'联系人',member:'内部成员',quotation:'报价单',workitem:'工作活动',task:'任务',product:'产品'};
  tip.querySelector('.t-type').textContent = types[d.nodeType]||'';
  let dt='';
  if(d.nodeType==='project') dt=`${d.stage} · ${d.amount}`;
  else if(d.nodeType==='company') dt=d.role;
  else if(d.nodeType==='contact') dt=`${d.position} · ${ALL_NODES[d.parentCompany]?.name||''}`;
  else if(d.nodeType==='member') dt=`${d.role} · ${d.dept}`;
  else if(d.nodeType==='quotation') dt=`${d.amount} · ${d.status}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='workitem') dt=`${d.workType} · ${d.date}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='task') dt=`${d.status} · 指派: ${d.assignee||''}${d.detail?'<br>'+d.detail:''}`;
  else if(d.nodeType==='product') dt=`${d.category||''} · ${d.brand||''}`;
  else dt=d.detail||'';
  // ★ 非中心项目提示可切换
  if (isOtherProject(d)) {
    dt+='<br><span style="color:rgba(180,200,255,0.5)">点击切换为中心项目</span>';
  } else if(d.hasMore) {
    dt+='<br><span style="color:rgba(255,255,255,0.25)">点击展开更多</span>';
  }
  tip.querySelector('.t-detail').innerHTML = dt;
  tip.classList.add('show'); moveTip(ev);
}
function moveTip(ev){ tip.style.left=(ev.clientX+14)+'px'; tip.style.top=(ev.clientY-8)+'px'; }
function hideTip(){ tip.classList.remove('show'); }

// 搜索
document.getElementById('searchInput').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  nodeLayer.selectAll('.snode').transition().duration(300)
    .attr('opacity',d=>!q||d.name.toLowerCase().includes(q)?1:0.06);
  linkLayer.selectAll('.cline').transition().duration(300).attr('opacity',d=>!q?1:0.02);
});

window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  svg.attr('width',w).attr('height',h);
  nebulaCanvas.width=w; nebulaCanvas.height=h;
  sim.alpha(0.3).restart();
});

// ============================================================
// 启动
// ============================================================
render();
</script>
