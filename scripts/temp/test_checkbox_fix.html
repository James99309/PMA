<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复选框修复测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 模拟修复后的CSS */

        /* 隐藏规格选择区域的单选框（只针对规格选择，不影响配置区域） */
        #productConfigModal #codeSelectionArea .spec-options-list .form-check-input,
        #productConfigModal .spec-options-list .form-check-input[type="radio"] {
          display: none !important;
        }

        /* 确保配置复选框显示 - 使用最高优先级选择器 */
        #productConfigModal #configurationsContainer .form-check.config-item-text input.form-check-input[type="checkbox"],
        #productConfigModal #configurationsArea .config-item-text .form-check-input[type="checkbox"],
        #productConfigModal .config-item-text input[type="checkbox"].form-check-input {
          margin-top: 0.25rem !important;
          margin-right: 0.5rem !important;
          flex-shrink: 0 !important;
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          position: relative !important;
          width: 1.25rem !important;
          height: 1.25rem !important;
          min-width: 1.25rem !important;
          cursor: pointer !important;
          clip: auto !important;
          clip-path: none !important;
          z-index: 1 !important;
          -webkit-appearance: checkbox !important;
          -moz-appearance: checkbox !important;
          appearance: checkbox !important;
        }

        .config-item-text {
          padding: 0.5rem 0;
          border-bottom: 1px solid #f0f0f0;
          display: flex;
          align-items: flex-start;
        }

        .config-item-text .form-check-label {
          cursor: pointer;
          margin-left: 0.5rem;
          flex: 1;
        }

        .config-line-1 {
          color: #212529;
          font-size: 0.9rem;
          margin-bottom: 0.25rem;
        }

        .config-line-2 {
          color: #6c757d;
          font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5" id="productConfigModal">
        <h2>复选框显示测试</h2>

        <div class="card mt-4">
            <div class="card-header">
                <h5>测试1: 规格选择区域（单选框应该被隐藏）</h5>
            </div>
            <div class="card-body" id="codeSelectionArea">
                <div class="spec-options-list">
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio1" name="spec">
                        <label class="form-check-label" for="radio1">
                            选项1（单选框应该不可见 - 使用自定义圆圈）
                        </label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio2" name="spec">
                        <label class="form-check-label" for="radio2">
                            选项2（单选框应该不可见 - 使用自定义圆圈）
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h5>测试2: 配置区域（复选框应该显示）</h5>
            </div>
            <div class="card-body" id="configurationsArea">
                <h6>室外全向玻璃钢天线</h6>
                <div id="configurationsContainer">
                    <div class="form-check config-item-text">
                        <input type="checkbox" class="form-check-input" id="check1">
                        <label class="form-check-label" for="check1">
                            <div class="config-line-1">型号：E-ANTG-150 | MN：EANFOMO5HR1</div>
                            <div class="config-line-2">频率范围：150-170MHz 增益：5dBi 防护等级：IP65</div>
                        </label>
                    </div>

                    <div class="form-check config-item-text">
                        <input type="checkbox" class="form-check-input" id="check2">
                        <label class="form-check-label" for="check2">
                            <div class="config-line-1">型号：E-ANTG 400 | MN：EANLOMO5HR1</div>
                            <div class="config-line-2">频率范围：400-430MHz 增益：5dBi 防护等级：IP65</div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="alert alert-info mt-4">
            <h6>✅ 预期效果：</h6>
            <ul>
                <li>规格选择区域的单选框应该<strong>不可见</strong>（被CSS隐藏）</li>
                <li>配置区域的复选框应该<strong>可见且可点击</strong></li>
            </ul>
        </div>
    </div>

    <script>
        // 检查复选框状态
        window.addEventListener('DOMContentLoaded', function() {
            console.log('=== 复选框显示测试 ===');

            // 检查规格选择区域的单选框
            const radios = document.querySelectorAll('#codeSelectionArea .form-check-input[type="radio"]');
            console.log(`\n规格选择区域单选框数量: ${radios.length}`);
            radios.forEach((radio, i) => {
                const styles = window.getComputedStyle(radio);
                console.log(`  单选框 ${i+1} display: ${styles.display} (应该是 none)`);
            });

            // 检查配置区域的复选框
            const checkboxes = document.querySelectorAll('#configurationsContainer .form-check-input[type="checkbox"]');
            console.log(`\n配置区域复选框数量: ${checkboxes.length}`);
            checkboxes.forEach((checkbox, i) => {
                const styles = window.getComputedStyle(checkbox);
                console.log(`  复选框 ${i+1}:`, {
                    display: styles.display,
                    visibility: styles.visibility,
                    opacity: styles.opacity,
                    width: styles.width,
                    height: styles.height
                });
                console.log(`    ✓ 应该全部可见 (display: block, visibility: visible, opacity: 1)`);
            });
        });
    </script>
</body>
</html>
