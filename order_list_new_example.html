{% extends "base.html" %}
{% from 'macros/ui_helpers.html' import render_data_list %}

{% block title %}订单列表 - 通用组件示例{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    {{ render_data_list(list_config) }}
</div>

<script src="{{ url_for('static', filename='js/filter-search.js') }}"></script>
<script src="{{ url_for('static', filename='js/data-list.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // 配置数据列表
    const orderListConfig = {
        module_name: 'order',
        ajax_mode: true,
        ajax_endpoint: '{{ url_for("inventory.order_list_ajax") }}',
        ajax_target: '#orderTableBody',
        
        // 统计卡片配置
        stats: {
            cards: [
                {
                    id: 'total',
                    title: '全部订单',
                    icon: 'fas fa-list-alt',
                    value: {{ total_count }},
                    amount: {{ "%.2f"|format(total_amount/10000) }},
                    unit: '单',
                    amount_unit: '万元',
                    color: 'primary',
                    clickable: true,
                    click_params: {},
                    data_key: 'total'
                },
                {
                    id: 'pending',
                    title: '待入库',
                    icon: 'fas fa-clock',
                    value: {{ pending_count }},
                    amount: {{ "%.2f"|format(pending_amount/10000) }},
                    unit: '单',
                    amount_unit: '万元',
                    color: 'warning',
                    clickable: true,
                    click_params: { 'inventory_status': 'pending' },
                    data_key: 'pending'
                },
                {
                    id: 'partial',
                    title: '部分入库',
                    icon: 'fas fa-exclamation-triangle',
                    value: {{ partial_count }},
                    amount: {{ "%.2f"|format(partial_amount/10000) }},
                    unit: '单',
                    amount_unit: '万元',
                    color: 'info',
                    clickable: true,
                    click_params: { 'inventory_status': 'partially_received' },
                    data_key: 'partial'
                },
                {
                    id: 'completed',
                    title: '已入库',
                    icon: 'fas fa-check-circle',
                    value: {{ completed_count }},
                    amount: {{ "%.2f"|format(completed_amount/10000) }},
                    unit: '单',
                    amount_unit: '万元',
                    color: 'success',
                    clickable: true,
                    click_params: { 'inventory_status': 'fully_received' },
                    data_key: 'completed'
                }
            ]
        },
        
        // 筛选配置（使用现有的filter_config）
        filter: {{ filter_config | tojson | safe }},
        
        // 表格配置
        table: {
            ajax_target: 'orderTableBody',
            title: '订单列表',
            icon: 'fas fa-table',
            badge_text: {% if inventory_status %}'{{ 
                "全部订单" if not inventory_status else 
                "待入库订单" if inventory_status == "pending" else
                "部分入库订单" if inventory_status == "partially_received" else
                "已入库订单" if inventory_status == "fully_received" else
                "筛选结果"
            }}'{% else %}'全部订单'{% endif %},
            columns: [
                {
                    key: 'order_number',
                    label: '订单号',
                    type: 'link',
                    url_template: '/inventory/order/{id}',
                    width: '140px'
                },
                {
                    key: 'company_name',
                    label: '公司',
                    type: 'text',
                    width: '180px'
                },
                {
                    key: 'order_date',
                    label: '订单日期',
                    type: 'date',
                    format: '%Y-%m-%d',
                    width: '120px'
                },
                {
                    key: 'expected_date',
                    label: '预期日期',
                    type: 'date',
                    format: '%Y-%m-%d',
                    width: '120px'
                },
                {
                    key: 'total_quantity',
                    label: '总数量',
                    type: 'number',
                    align: 'center',
                    width: '80px'
                },
                {
                    key: 'total_amount',
                    label: '总金额',
                    type: 'number',
                    format: 'wan',
                    align: 'end',
                    width: '100px'
                },
                {
                    key: 'status',
                    label: '审批状态',
                    type: 'badge',
                    render: 'render_order_status_badge',
                    width: '100px'
                },
                {
                    key: 'inventory_status',
                    label: '入库状态',
                    type: 'badge',
                    render: 'render_inventory_status_badge',
                    width: '100px'
                },
                {
                    key: 'owner_name',
                    label: '创建人',
                    type: 'badge',
                    width: '120px'
                }
            ]
        },
        
        // 自定义回调函数
        onStatsUpdate: function(statistics) {
            console.log('📊 统计数据已更新:', statistics);
        },
        
        onDataLoad: function(data) {
            console.log('📋 数据加载完成:', data);
            // 可以在这里添加自定义的数据处理逻辑
        }
    };
    
    // 初始化数据列表
    setupDataList(orderListConfig);
    
    // 设置全局配置供重置按钮使用
    setGlobalDataListConfig('order', orderListConfig);
});
</script>
{% endblock %}
