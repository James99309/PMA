<!DOCTYPE html>
<html lang="zh" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分系数内联编辑 - UI 预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .dark body { background: #0f172a; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 p-8">

<div class="max-w-sm mx-auto space-y-8">

    <div class="text-center mb-8">
        <h1 class="text-lg font-bold text-slate-800 dark:text-white mb-2">积分系数内联编辑 UI 预览</h1>
        <button onclick="document.documentElement.classList.toggle('dark')"
            class="text-xs px-3 py-1 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
            切换亮/暗模式
        </button>
    </div>

    <!-- ===== 状态1: 正常显示 (自动系数) ===== -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-500 mb-3 font-semibold uppercase tracking-wider">状态1: 自动系数 (admin视角)</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-1">
                <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide font-semibold">产品积分</p>
                <!-- 系数显示 + 编辑按钮 -->
                <span class="text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1" id="coeffDisplay1">
                    系数: 2.5X
                    <button onclick="toggleEdit(1)" class="ml-0.5 text-slate-400 hover:text-blue-500 transition-colors" title="编辑系数">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                        </svg>
                    </button>
                </span>
                <!-- 编辑表单 (默认隐藏) -->
                <div id="coeffEdit1" class="hidden items-center gap-1.5">
                    <div class="flex items-center bg-slate-50 dark:bg-slate-700/50 rounded-md border border-slate-200 dark:border-slate-600">
                        <input type="number" step="0.5" min="1.0" max="10.0" placeholder="自动"
                            class="w-14 text-xs text-right bg-transparent border-none focus:ring-0 py-1 px-1.5 text-slate-700 dark:text-slate-200 placeholder:text-slate-400"
                            value="">
                        <span class="text-xs text-slate-400 pr-1.5">X</span>
                    </div>
                    <button onclick="toggleEdit(1)" class="text-emerald-500 hover:text-emerald-600 transition-colors" title="保存">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </button>
                    <button onclick="toggleEdit(1)" class="text-slate-400 hover:text-slate-500 transition-colors" title="取消">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🪙</span>
                <span class="text-2xl font-bold text-amber-500">8,610</span>
            </div>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
                = 2.5 &times; ¥3,444.00
            </p>
        </div>
    </div>

    <!-- ===== 状态2: 手动系数显示 ===== -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-500 mb-3 font-semibold uppercase tracking-wider">状态2: 手动系数 (admin视角)</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-1">
                <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide font-semibold">产品积分</p>
                <span class="text-xs text-slate-400 dark:text-slate-500 flex items-center gap-1" id="coeffDisplay2">
                    系数: 1.5X
                    <span class="text-orange-400">(手动)</span>
                    <button onclick="toggleEdit(2)" class="ml-0.5 text-slate-400 hover:text-blue-500 transition-colors" title="编辑系数">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                        </svg>
                    </button>
                </span>
                <div id="coeffEdit2" class="hidden items-center gap-1.5">
                    <div class="flex items-center bg-slate-50 dark:bg-slate-700/50 rounded-md border border-slate-200 dark:border-slate-600">
                        <input type="number" step="0.5" min="1.0" max="10.0" placeholder="自动"
                            class="w-14 text-xs text-right bg-transparent border-none focus:ring-0 py-1 px-1.5 text-slate-700 dark:text-slate-200 placeholder:text-slate-400"
                            value="1.5">
                        <span class="text-xs text-slate-400 pr-1.5">X</span>
                    </div>
                    <button onclick="toggleEdit(2)" class="text-emerald-500 hover:text-emerald-600 transition-colors" title="保存">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </button>
                    <button onclick="toggleEdit(2)" class="text-slate-400 hover:text-slate-500 transition-colors" title="取消">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🪙</span>
                <span class="text-2xl font-bold text-amber-500">5,166</span>
            </div>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
                = 1.5 &times; ¥3,444.00
            </p>
        </div>
    </div>

    <!-- ===== 状态3: 编辑模式展开 ===== -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-500 mb-3 font-semibold uppercase tracking-wider">状态3: 编辑模式展开</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-1">
                <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide font-semibold">产品积分</p>
                <!-- 显示文字隐藏 -->
                <span class="text-xs text-slate-400 dark:text-slate-500 hidden">
                    系数: 2.5X
                </span>
                <!-- 编辑表单展开 -->
                <div class="flex items-center gap-1.5">
                    <div class="flex items-center bg-slate-50 dark:bg-slate-700/50 rounded-md border border-blue-300 dark:border-blue-500 ring-1 ring-blue-200 dark:ring-blue-500/30">
                        <input type="number" step="0.5" min="1.0" max="10.0" placeholder="自动"
                            class="w-14 text-xs text-right bg-transparent border-none focus:ring-0 py-1 px-1.5 text-slate-700 dark:text-slate-200 placeholder:text-slate-400"
                            value="2.0" autofocus>
                        <span class="text-xs text-slate-400 pr-1.5">X</span>
                    </div>
                    <button class="text-emerald-500 hover:text-emerald-600 transition-colors" title="保存">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </button>
                    <button class="text-slate-400 hover:text-slate-500 transition-colors" title="取消">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🪙</span>
                <span class="text-2xl font-bold text-amber-500">8,610</span>
            </div>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
                = 2.5 &times; ¥3,444.00
            </p>
            <p class="text-xs text-blue-400 mt-1 italic">留空 = 按时间衰减自动计算</p>
        </div>
    </div>

    <!-- ===== 状态4: 非admin视角（无编辑按钮） ===== -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-5">
        <p class="text-xs text-slate-500 mb-3 font-semibold uppercase tracking-wider">状态4: 非admin视角 (无编辑按钮)</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-1">
                <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide font-semibold">产品积分</p>
                <span class="text-xs text-slate-400 dark:text-slate-500">
                    系数: 2.5X
                </span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-2xl">🪙</span>
                <span class="text-2xl font-bold text-amber-500">8,610</span>
            </div>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">
                = 2.5 &times; ¥3,444.00
            </p>
        </div>
    </div>

</div>

<script>
function toggleEdit(n) {
    const display = document.getElementById('coeffDisplay' + n);
    const edit = document.getElementById('coeffEdit' + n);
    if (edit.classList.contains('hidden')) {
        display.classList.add('hidden');
        edit.classList.remove('hidden');
        edit.classList.add('flex');
        edit.querySelector('input').focus();
    } else {
        display.classList.remove('hidden');
        edit.classList.add('hidden');
        edit.classList.remove('flex');
    }
}
</script>
</body>
</html>
