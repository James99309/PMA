<!DOCTYPE html>
<html lang="zh" x-data="streamDemo()" :class="darkMode ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenClaw Streaming Preview - Natural Language Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .typing-dot:nth-child(1) { animation: pulse-dot 1.4s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation: pulse-dot 1.4s ease-in-out 0.2s infinite; }
        .typing-dot:nth-child(3) { animation: pulse-dot 1.4s ease-in-out 0.4s infinite; }

        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .streaming-cursor { animation: cursor-blink 0.8s ease-in-out infinite; }
    </style>
</head>
<body class="bg-white dark:bg-slate-900 min-h-screen transition-colors duration-300">
    <div class="max-w-2xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-slate-800 dark:text-slate-200">OpenClaw Streaming Preview</h1>
            <div class="flex items-center gap-3">
                <button @click="darkMode = !darkMode"
                        class="px-3 py-1.5 text-xs font-medium rounded-lg border cursor-pointer transition-colors"
                        :class="darkMode
                            ? 'bg-slate-700 text-slate-300 border-slate-600 hover:bg-slate-600'
                            : 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-slate-200'">
                    <span x-text="darkMode ? '☀️ Light' : '🌙 Dark'"></span>
                </button>
                <button @click="resetAndPlay()"
                        class="px-3 py-1.5 text-xs font-medium rounded-lg bg-violet-600 text-white hover:bg-violet-700 cursor-pointer transition-colors">
                    Replay
                </button>
            </div>
        </div>

        <!-- Chat area -->
        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 min-h-[500px]">

            <!-- User message -->
            <div class="flex justify-start mb-4">
                <div class="max-w-[75%]">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="text-[11px] font-medium text-blue-500">User</span>
                    </div>
                    <div class="bg-blue-50 dark:bg-blue-900/20 rounded-2xl rounded-bl-md px-4 py-2.5 text-sm border border-blue-200 dark:border-blue-800 text-slate-700 dark:text-slate-300">
                        帮我查询公司列表中客户数量最多的前5个城市
                    </div>
                </div>
            </div>

            <!-- Typing indicator -->
            <div x-show="phase === 'typing'" class="flex justify-end mb-4">
                <div class="max-w-[75%]">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="text-[11px] font-medium text-violet-500">AI 助手</span>
                        <span class="text-[9px] bg-violet-100 dark:bg-violet-900/40 text-violet-600 dark:text-violet-400 px-1 py-0.5 rounded font-medium">AI</span>
                    </div>
                    <div class="bg-violet-50 dark:bg-violet-900/20 rounded-2xl rounded-br-md px-4 py-3 border border-violet-200 dark:border-violet-800">
                        <div class="flex items-center gap-1.5">
                            <div class="typing-dot w-2 h-2 bg-violet-400 rounded-full"></div>
                            <div class="typing-dot w-2 h-2 bg-violet-400 rounded-full"></div>
                            <div class="typing-dot w-2 h-2 bg-violet-400 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Thinking panel -->
            <div x-show="thinkingText" x-transition class="flex justify-end mb-2">
                <div class="max-w-[75%]">
                    <button @click="thinkingCollapsed = !thinkingCollapsed"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg transition-colors cursor-pointer"
                            :class="thinkingCollapsed
                                ? 'text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20 border border-purple-200 dark:border-purple-800 hover:bg-purple-100 dark:hover:bg-purple-900/30'
                                : 'text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/30 border border-purple-300 dark:border-purple-700'">
                        <span class="material-symbols-outlined text-sm">psychology</span>
                        <span>思考过程</span>
                        <span class="material-symbols-outlined text-sm transition-transform duration-200"
                              :class="thinkingCollapsed ? '' : 'rotate-180'">expand_more</span>
                        <!-- Pulse indicator while still thinking -->
                        <span x-show="phase === 'thinking1' || phase === 'thinking2'" class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span>
                        </span>
                    </button>
                    <div x-show="!thinkingCollapsed" x-transition
                         class="mt-1.5 bg-slate-50 dark:bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-200 dark:border-slate-700 max-h-48 overflow-y-auto">
                        <div class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed whitespace-pre-wrap" x-text="thinkingText"></div>
                    </div>
                </div>
            </div>

            <!-- Status message (natural language) -->
            <div x-show="statusMsg" x-transition class="flex justify-end mb-2">
                <div class="inline-flex items-center gap-2 px-3 py-1.5 text-xs text-slate-500 dark:text-slate-400">
                    <svg x-show="!statusMsg.startsWith('⚠️')" class="animate-spin h-3 w-3" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/></svg>
                    <span x-text="statusMsg" :class="statusMsg.startsWith('⚠️') ? 'text-red-500 dark:text-red-400' : ''"></span>
                </div>
            </div>

            <!-- Streaming response -->
            <div x-show="streamingMsg" class="flex justify-end">
                <div class="max-w-[75%]">
                    <div class="flex items-center gap-1.5 mb-1">
                        <span class="text-[11px] font-medium text-violet-500">AI 助手</span>
                        <span class="text-[9px] bg-violet-100 dark:bg-violet-900/40 text-violet-600 dark:text-violet-400 px-1 py-0.5 rounded font-medium">AI</span>
                    </div>
                    <div class="bg-violet-50 dark:bg-violet-900/20 rounded-2xl rounded-br-md px-4 py-2.5 text-sm leading-relaxed border border-violet-200 dark:border-violet-800 text-slate-700 dark:text-slate-300">
                        <span x-text="streamingMsg"></span>
                        <span x-show="phase === 'response'" class="streaming-cursor text-violet-500 text-lg leading-none">▌</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phase indicator -->
        <div class="mt-4 text-center text-xs text-slate-400 dark:text-slate-500">
            Phase: <span x-text="phase" class="font-mono font-medium"></span>
        </div>
    </div>

    <script>
        function streamDemo() {
            return {
                darkMode: false,
                phase: 'idle',
                thinkingText: '',
                thinkingCollapsed: false,
                statusMsg: '',
                streamingMsg: '',

                init() {
                    this.play();
                },

                resetAndPlay() {
                    this.phase = 'idle';
                    this.thinkingText = '';
                    this.thinkingCollapsed = false;
                    this.statusMsg = '';
                    this.streamingMsg = '';
                    setTimeout(() => this.play(), 300);
                },

                async play() {
                    // Phase 1: Typing dots
                    this.phase = 'typing';
                    await this.delay(1200);

                    // Phase 2: First thinking round
                    this.phase = 'thinking1';
                    this.thinkingCollapsed = false;
                    const thinking1 = '用户需要查询公司列表中客户数量最多的前5个城市。我需要使用数据库查询工具来获取这些信息。让我构建一个 SQL 查询...';
                    await this.streamText(thinking1, (t) => this.thinkingText = t, 30);
                    await this.delay(500);

                    // Phase 3: First tool call → natural language status
                    this.phase = 'tool1';
                    this.thinkingCollapsed = true;
                    this.statusMsg = '正在查询数据库...';
                    await this.delay(2000);

                    // Tool result success → clear status
                    this.statusMsg = '';
                    await this.delay(400);

                    // Phase 4: Second thinking round
                    this.phase = 'thinking2';
                    this.thinkingCollapsed = false;
                    const thinking2 = '\n\n查询结果返回了数据。让我也查一下每个城市的总金额来丰富分析...';
                    await this.streamText(this.thinkingText + thinking2, (t) => this.thinkingText = t, 30);
                    await this.delay(500);

                    // Phase 5: Second tool call → error
                    this.phase = 'tool2';
                    this.thinkingCollapsed = true;
                    this.statusMsg = '正在查询数据库...';
                    await this.delay(1500);

                    // Tool error
                    this.statusMsg = '⚠️ 工具执行出错: column "amount" does not exist';
                    await this.delay(1200);

                    // Phase 6: Retry → success
                    this.statusMsg = '正在查询数据库...';
                    await this.delay(1800);

                    // Success → clear status
                    this.statusMsg = '';
                    await this.delay(400);

                    // Phase 7: Response streaming
                    this.phase = 'response';
                    this.thinkingCollapsed = true;
                    const response = '根据数据库查询结果，客户数量最多的前5个城市如下：\n\n1. **上海** — 156 家客户，总金额 ¥245.0 万\n2. **北京** — 132 家客户，总金额 ¥198.0 万\n3. **深圳** — 98 家客户，总金额 ¥156.3 万\n4. **广州** — 87 家客户，总金额 ¥134.5 万\n5. **杭州** — 65 家客户，总金额 ¥98.7 万\n\n上海和北京遥遥领先，合计占总客户数的 53.5%。';
                    await this.streamText(response, (t) => this.streamingMsg = t, 25);

                    // Done
                    this.phase = 'done';
                },

                async streamText(fullText, setter, intervalMs) {
                    let currentText = '';
                    for (let i = 0; i < fullText.length; i++) {
                        currentText += fullText[i];
                        setter(currentText);
                        await this.delay(intervalMs + Math.random() * 15);
                    }
                },

                delay(ms) {
                    return new Promise(resolve => setTimeout(resolve, ms));
                },
            }
        }
    </script>
</body>
</html>
