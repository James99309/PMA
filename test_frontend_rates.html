<!DOCTYPE html>
<html>
<head>
    <title>合格值功能测试</title>
    <style>
        .test-container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .rate-input { width: 100px; margin: 5px; padding: 5px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>🎯 绩效目标合格值功能测试</h2>
        
        <h3>1. 合格值输入框测试</h3>
        <table border="1" style="border-collapse: collapse; width: 100%;">
            <tr>
                <td><strong>合格值</strong></td>
                <td><input type="number" class="rate-input" id="implant_rate" placeholder="80" min="0" max="100" step="1" value="90"></td>
                <td><input type="number" class="rate-input" id="sales_rate" placeholder="80" min="0" max="100" step="1" value="85"></td>
                <td><input type="number" class="rate-input" id="customers_rate" placeholder="80" min="0" max="100" step="1" value="80"></td>
                <td><input type="number" class="rate-input" id="projects_rate" placeholder="80" min="0" max="100" step="1" value="88"></td>
            </tr>
        </table>
        
        <h3>2. 数据收集测试</h3>
        <button onclick="testDataCollection()">测试数据收集</button>
        <div id="dataResult" class="result"></div>
        
        <h3>3. 保存数据格式测试</h3>
        <button onclick="testSaveFormat()">测试保存格式</button>
        <div id="saveResult" class="result"></div>
        
        <h3>4. 完整保存请求模拟</h3>
        <button onclick="testFullSaveRequest()">模拟完整保存请求</button>
        <div id="requestResult" class="result"></div>
    </div>

    <script>
        function testDataCollection() {
            // 收集合格值数据
            const rateData = {
                implant_rate: parseInt(document.getElementById('implant_rate')?.value) || 0,
                sales_rate: parseInt(document.getElementById('sales_rate')?.value) || 0,
                customers_rate: parseInt(document.getElementById('customers_rate')?.value) || 0,
                projects_rate: parseInt(document.getElementById('projects_rate')?.value) || 0
            };
            
            const result = document.getElementById('dataResult');
            result.className = 'result success';
            result.innerHTML = `
                <h4>✅ 合格值数据收集成功：</h4>
                <ul>
                    <li>植入合格值: ${rateData.implant_rate}%</li>
                    <li>销售合格值: ${rateData.sales_rate}%</li>
                    <li>客户合格值: ${rateData.customers_rate}%</li>
                    <li>项目合格值: ${rateData.projects_rate}%</li>
                </ul>
                <p><strong>JSON格式:</strong> ${JSON.stringify(rateData, null, 2)}</p>
            `;
        }
        
        function testSaveFormat() {
            const userId = 5;
            const year = 2025;
            const isChinese = true;
            
            // 收集合格值数据
            const rateData = {
                implant_rate: parseInt(document.getElementById('implant_rate')?.value) || 0,
                sales_rate: parseInt(document.getElementById('sales_rate')?.value) || 0,
                customers_rate: parseInt(document.getElementById('customers_rate')?.value) || 0,
                projects_rate: parseInt(document.getElementById('projects_rate')?.value) || 0
            };
            
            // 模拟1月份数据
            const targetData = {
                user_id: userId,
                year: year,
                month: 1,
                implant_amount_target: isChinese ? (20 * 10000) : (20 * 1000000), // 20万元
                sales_amount_target: isChinese ? (15 * 10000) : (15 * 1000000),   // 15万元
                new_customers_target: 3,
                new_projects_target: 5,
                // 合格值数据
                implant_rate: rateData.implant_rate,
                sales_rate: rateData.sales_rate,
                customers_rate: rateData.customers_rate,
                projects_rate: rateData.projects_rate
            };
            
            const result = document.getElementById('saveResult');
            result.className = 'result success';
            result.innerHTML = `
                <h4>✅ 单月保存数据格式：</h4>
                <pre>${JSON.stringify(targetData, null, 2)}</pre>
            `;
        }
        
        function testFullSaveRequest() {
            const userId = 5;
            const year = 2025;
            const isChinese = true;
            
            // 收集合格值数据
            const rateData = {
                implant_rate: parseInt(document.getElementById('implant_rate')?.value) || 0,
                sales_rate: parseInt(document.getElementById('sales_rate')?.value) || 0,
                customers_rate: parseInt(document.getElementById('customers_rate')?.value) || 0,
                projects_rate: parseInt(document.getElementById('projects_rate')?.value) || 0
            };
            
            // 模拟12个月的数据
            const targets = [];
            for (let month = 1; month <= 12; month++) {
                const targetData = {
                    user_id: userId,
                    year: year,
                    month: month,
                    implant_amount_target: isChinese ? (20 * 10000) : (20 * 1000000),
                    sales_amount_target: isChinese ? (15 * 10000) : (15 * 1000000),
                    new_customers_target: 3,
                    new_projects_target: 5,
                    // 合格值数据
                    implant_rate: rateData.implant_rate,
                    sales_rate: rateData.sales_rate,
                    customers_rate: rateData.customers_rate,
                    projects_rate: rateData.projects_rate
                };
                targets.push(targetData);
            }
            
            const fullRequest = { targets: targets };
            
            const result = document.getElementById('requestResult');
            result.className = 'result success';
            result.innerHTML = `
                <h4>✅ 完整保存请求格式：</h4>
                <p><strong>请求数据量:</strong> ${targets.length} 个月份</p>
                <p><strong>每条记录包含合格值:</strong> 是</p>
                <p><strong>数据大小:</strong> ${JSON.stringify(fullRequest).length} 字符</p>
                <details>
                    <summary>查看完整JSON (点击展开)</summary>
                    <pre>${JSON.stringify(fullRequest, null, 2)}</pre>
                </details>
                
                <h4>🧪 验证关键字段：</h4>
                <ul>
                    <li>targets[0].implant_rate: ${targets[0].implant_rate}</li>
                    <li>targets[0].sales_rate: ${targets[0].sales_rate}</li>
                    <li>targets[0].customers_rate: ${targets[0].customers_rate}</li>
                    <li>targets[0].projects_rate: ${targets[0].projects_rate}</li>
                </ul>
            `;
        }
        
        // 页面加载时自动运行测试
        window.onload = function() {
            console.log('🎯 绩效目标合格值功能测试页面已加载');
            testDataCollection();
        };
    </script>
</body>
</html>
